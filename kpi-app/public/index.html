<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KPI отдела ассистентов</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --surface:#fff; --surface-2:#FAFAFC;
  --fg:#1D1D1F; --fg-2:#4B4B50; --fg-3:#86868B;
  --accent:#0071E3; --accent-soft:#E8F1FD;
  --green:#0B8A4B; --green-soft:#E6F5ED;
  --amber:#B26A00; --amber-soft:#FFF3E0;
  --red:#C4302B; --red-soft:#FDECEA;
  --border:#E3E3E7; --border-2:#EDEDF0;
  --radius:18px; --radius-sm:11px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --surface:#1C1C1E; --surface-2:#141416;
    --fg:#F5F5F7; --fg-2:#C7C7CC; --fg-3:#8E8E93;
    --accent:#2E9BFF; --accent-soft:#122437;
    --green:#4ADE80; --green-soft:#10241A;
    --amber:#FBBF24; --amber-soft:#2A2010;
    --red:#FF6B63; --red-soft:#2E1614;
    --border:#2C2C2E; --border-2:#242426;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.2;margin:0}
h1{font-size:26px;font-weight:750}h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:650}h4{font-size:15px;font-weight:650}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--border-2);
}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:750;font-size:16px;margin-right:auto}
.who{font-size:13.5px;color:var(--fg-3)}
.who b{color:var(--fg)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;border-radius:100px;font-size:14px;font-weight:550;color:var(--fg-2);
  background:transparent;border:none;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;
}
.tab:hover{background:var(--surface)}
.tab.on{background:var(--accent);color:#fff}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g4{grid-template-columns:1fr}}
section.page{padding:22px 0 60px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.metric .lbl{font-size:13px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.metric .val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.metric .sub{font-size:13px;color:var(--fg-3);margin-top:4px}
.bar{height:6px;border-radius:100px;background:var(--border);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:100px;transition:width .5s cubic-bezier(.16,1,.3,1)}

.kef{display:flex;align-items:baseline;gap:12px}
.kef .big{font-size:46px;font-weight:850;letter-spacing:-.04em;color:var(--accent);line-height:1}
.money{font-size:26px;font-weight:800;letter-spacing:-.03em}

table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
th{
  text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--fg-3);padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);
  position:sticky;top:0;
}
td{padding:12px 14px;border-bottom:1px solid var(--border-2);color:var(--fg-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer;transition:background .15s}
tbody tr.clickable:hover{background:var(--surface-2)}
td strong{color:var(--fg)}
.num{text-align:right;white-space:nowrap}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:100px;white-space:nowrap}
.t-green{background:var(--green-soft);color:var(--green)}
.t-blue{background:var(--accent-soft);color:var(--accent)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-grey{background:var(--surface-2);color:var(--fg-3);border:1px solid var(--border)}

.btn{
  display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;font-family:inherit;
  font-size:14.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:100px;
  cursor:pointer;transition:opacity .2s,transform .12s;
}
.btn:hover{opacity:.88}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--red)}
.btn.ghost.danger{background:transparent;color:var(--red);border-color:var(--red)}
/* отключённый сотрудник виден, но приглушён */
tr.off{opacity:.45}
/* Поля прямо в таблице. Ширины заданы через колонки, а не через поля,
   чтобы таблица влезала целиком и её не приходилось прокручивать. */
td .e{padding:6px 8px;font-size:14px;min-height:34px;border-radius:8px;width:100%;min-width:0}
#peopleTable{min-width:0;table-layout:fixed;width:100%}
#peopleTable th,#peopleTable td{padding:10px 8px}
#peopleTable col.c-name{width:17%}
#peopleTable col.c-role{width:14%}
#peopleTable col.c-grade{width:8%}
#peopleTable col.c-salary{width:9%}
#peopleTable col.c-yg{width:13%}
#peopleTable col.c-tg{width:11%}
#peopleTable col.c-nick{width:12%}
#peopleTable col.c-acts{width:16%}
/* технические id читать глазами не нужно — при наведении видно целиком */
td .e.id{font-size:12.5px;color:var(--fg-3)}
/* коэффициент помощи: минус, значение, плюс в одну строку */
td.help-cell{white-space:nowrap;display:flex;gap:5px;align-items:center;justify-content:flex-end}
td.help-cell .hb{min-height:28px;padding:0 9px;font-size:15px;line-height:1}
.help-val{font-size:15px;min-width:52px;text-align:center;cursor:pointer;border-radius:6px;padding:2px 4px}
.help-val[data-help-set]:hover{background:var(--surface-2);outline:1px solid var(--border)}
td.acts{white-space:nowrap;display:flex;gap:4px;justify-content:flex-end;align-items:center}
td.acts .btn{padding:0 9px;font-size:12.5px}
@media(max-width:1100px){
  #peopleTable{min-width:920px;table-layout:auto}
  td .e{width:auto}
}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}

input,select{
  padding:10px 12px;font-size:15px;font-family:inherit;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);color:var(--fg);min-height:42px;width:100%;
}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label{display:block;font-size:13.5px;font-weight:550;margin-bottom:6px}
.field{margin-bottom:14px}

.muted{color:var(--fg-3);font-size:13.5px;line-height:1.5}
.why{
  margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;
  font-size:13px;color:var(--fg-2);line-height:1.6;border:1px solid var(--border-2);
}
/* Почему из кошелька пришло меньше, чем набрано по оценке */
.cuts{margin-top:10px;font-size:12.5px;color:var(--fg-3);line-height:1.5}
.cut{
  margin-top:6px;padding:7px 10px;border-radius:8px;
  background:var(--amber-soft);color:var(--amber);font-weight:600;
}
.cut .muted{color:inherit;opacity:.75;font-weight:400;font-size:12px}
.why b{color:var(--fg)}
details>summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:550;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:hover{text-decoration:underline}

.login{max-width:400px;margin:12vh auto;text-align:center}
.login .card{text-align:left}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:12px}
.ok{background:var(--green-soft);color:var(--green);padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:12px}
.hide{display:none}

.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;
}
.modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:680px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.timeline{list-style:none;padding:0;margin:14px 0 0}
.timeline li{padding:8px 0 8px 20px;border-left:2px solid var(--border);position:relative;font-size:14px}
.timeline li::before{content:'';position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline .t{color:var(--fg-3);font-size:12.5px}
.key-box{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:12px;word-break:break-all;margin-top:8px;
}

/* ── Модель времени ─────────────────────────────────────────────────────── */
/* таблица сотрудников: влезает целиком, строки раскрываются */
#kpiTable{min-width:0;table-layout:fixed}
#kpiTable th,#kpiTable td{padding:11px 10px}
#kpiTable td.num{font-variant-numeric:tabular-nums}
@media(max-width:900px){#kpiTable{min-width:760px;table-layout:auto}}
.mark{display:inline-block;min-width:44px;text-align:center;font-weight:800;letter-spacing:.02em;
  padding:3px 9px;border-radius:8px;font-size:14px}
.mark.m-minus{background:var(--red-soft);color:var(--red)}
.mark.m-plusminus{background:var(--amber-soft);color:var(--amber)}
.mark.m-plus{background:var(--accent-soft);color:var(--accent)}
.mark.m-plus2,.mark.m-plus3,.mark.m-plus4{background:var(--green-soft);color:var(--green)}
.mark.auto{opacity:.7;outline:1px dashed currentColor;outline-offset:-1px}
.pct-good{color:var(--green);font-weight:700}
.pct-mid{color:var(--amber);font-weight:700}
.pct-bad{color:var(--red);font-weight:700}
.access{display:inline-flex;gap:5px}
.access i{font-style:normal;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;
  background:var(--surface-2);color:var(--fg-3);border:1px solid var(--border)}
.access i.on{background:var(--green-soft);color:var(--green);border-color:transparent}

/* переключатели среза */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--fg-2);
  padding:6px 13px;border-radius:100px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* графики метрик */
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:960px){.charts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.charts{grid-template-columns:1fr}}
.chart .lbl{font-size:12.5px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chart .val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.chart .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.chart.clickable{cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.chart.clickable:hover{transform:translateY(-2px)}
.chart.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chart svg{width:100%;height:120px;margin-top:10px;display:block;overflow:visible}
.chart svg text{font-family:inherit;font-size:11px;fill:var(--fg-3)}
.chart svg .plan{stroke:var(--fg-3);stroke-dasharray:4 4;stroke-width:1.5}
.chart svg .b-ok{fill:var(--green)}
.chart svg .b-over{fill:var(--red)}
.chart svg .b-none{fill:var(--border)}
.chart svg .bv{fill:var(--fg);font-weight:700;font-size:11.5px}

/* раскрываемые месяцы и карточки людей */
details.month,details.person{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0;margin-bottom:10px;box-shadow:var(--shadow)}
details.month>summary,details.person>summary{
  display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:15px;font-weight:650;color:var(--fg);
  cursor:pointer;list-style:none;flex-wrap:wrap
}
details.month>summary::before,details.person>summary::before{
  content:'';width:8px;height:8px;border-right:2px solid var(--fg-3);border-bottom:2px solid var(--fg-3);
  transform:rotate(-45deg);transition:transform .2s;flex:none
}
details[open].month>summary::before,details[open].person>summary::before{transform:rotate(45deg)}
details.month>summary:hover,details.person>summary:hover{background:var(--surface-2);text-decoration:none}
details.month>.body,details.person>.body{padding:6px 16px 16px;border-top:1px solid var(--border-2)}
.sum-metrics{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:13px;color:var(--fg-3);font-weight:500}
.sum-metrics b{color:var(--fg)}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 14px}
@media(max-width:900px){.six{grid-template-columns:repeat(3,1fr)}}
.six .m{background:var(--surface-2);border-radius:10px;padding:9px 10px;border:1px solid var(--border-2)}
.six .m .k{font-size:11px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.six .m .v{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.six .m .p{font-size:11.5px;margin-top:1px}
.lvl{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-size:12px;font-weight:800;
  background:var(--accent-soft);color:var(--accent)}
.lvl.l3{background:var(--red-soft);color:var(--red)}
.lvl.l2{background:var(--amber-soft);color:var(--amber)}
.lvl.l1{background:var(--green-soft);color:var(--green)}
.src{font-size:11px;color:var(--fg-3);margin-left:4px}
a.yg{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);padding:0 5px;border-radius:6px;text-decoration:none}
a.yg:hover{background:var(--accent-soft)}
.review{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-2);margin-bottom:8px;font-size:14px}
.review .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg-3);margin-bottom:4px}
textarea{padding:10px 12px;font-size:15px;font-family:inherit;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);color:var(--fg);width:100%;min-height:84px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.score-in{width:74px;min-height:38px;padding:6px 10px;font-size:17px;font-weight:800;text-align:center;border-radius:10px}
tr.detail-row>td{background:var(--surface-2);padding:4px 16px 18px}
tr.detail-row .tbl{background:var(--surface)}
.score-in:disabled{opacity:.5}
/* приёмка: длинное название переносится, ссылка остаётся в строке текста */
#inboxTable td{vertical-align:middle}
#inboxTable .t-cell{max-width:640px;line-height:1.45}
#inboxTable .metric .val,#inboxTable+.muted{font-size:inherit}
.grid.g4 .metric .val.small{font-size:22px}
.matrix{min-width:0;table-layout:fixed}
.matrix input{padding:6px 8px;min-height:34px;font-size:14px;text-align:right}
.sla-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px 12px;align-items:center;max-width:620px}
.sla-grid .hd{font-size:12px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.sla-grid .rl{font-size:14px;font-weight:600}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login" class="login">
  <h1 style="margin-bottom:8px">KPI отдела</h1>
  <p class="muted" style="margin-bottom:22px">Введите свой ключ доступа</p>
  <div class="card">
    <div class="field">
      <label for="keyInput">Ключ доступа</label>
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="например 7f3a…">
    </div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center">Войти</button>
    <div id="loginErr" class="err hide"></div>
    <p class="muted" style="margin-top:14px">Ключ выдаёт руководитель отдела. Он хранится только в вашем браузере — на сервере лежит лишь его отпечаток.</p>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="hide">
  <header class="top">
    <div class="top-in">
      <span class="brand">KPI отдела</span>
      <span class="who">Вход: <b id="whoName">—</b> · <span id="whoRole"></span></span>
      <select id="periodSel" style="width:auto;min-width:150px"></select>
      <button class="btn ghost sm" id="logoutBtn">Выйти</button>
    </div>
    <div class="wrap"><div class="tabs" id="tabs"></div></div>
  </header>

  <section class="page"><div class="wrap" id="view"></div></section>
</div>

<script>
const API = '/api';
let KEY = localStorage.getItem('kpi_key') || '';
let ME = null;
let PERIOD = '';
let TAB = 'kpi';

// ── вспомогательное ─────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const money = (n) => (n === null || n === undefined ? '—' : Math.round(n).toLocaleString('ru-RU') + ' ₽');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  // Всё время в отделе — московское, независимо от того, где открыт браузер
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit', timeZone:'Europe/Moscow'});
}
function fmtSeconds(s){
  if (s === null || s === undefined) return '—';
  if (s < 60) return s + ' сек';
  const m = Math.round(s/60);
  if (m < 60) return m + ' мин';
  const h = Math.floor(m/60);
  return h + ' ч ' + (m%60) + ' мин';
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'x-access-key': KEY, 'content-type': 'application/json', ...(opts.headers||{}) },
  });
  if (res.status === 401) { logout(); throw new Error('ключ не подошёл'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'ошибка запроса');
  return data;
}

function logout(){
  localStorage.removeItem('kpi_key');
  KEY = ''; ME = null;
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
}

// ── вход ────────────────────────────────────────────────────────────────────
$('loginBtn').addEventListener('click', doLogin);
$('keyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin(){
  const key = $('keyInput').value.trim();
  if (!key) return;
  try {
    const res = await fetch(API + '/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ key }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'ключ не подошёл');
    KEY = key;
    localStorage.setItem('kpi_key', key);
    ME = data.user;
    start();
  } catch (e) {
    $('loginErr').textContent = e.message;
    $('loginErr').classList.remove('hide');
  }
}

$('logoutBtn').addEventListener('click', logout);

// ── старт ───────────────────────────────────────────────────────────────────
async function boot(){
  if (!KEY) return;
  try {
    const res = await fetch(API + '/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ key: KEY }),
    });
    if (!res.ok) return logout();
    ME = (await res.json()).user;
    start();
  } catch { logout(); }
}

function start(){
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('whoName').textContent = ME.name;
  $('whoRole').textContent = ({assistant:'ассистент', lead:'руководитель отдела', chief:'руководитель'})[ME.role];

  // периоды: текущий и 11 предыдущих месяцев
  const sel = $('periodSel');
  sel.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const o = document.createElement('option');
    o.value = v;
    o.textContent = d.toLocaleString('ru-RU', {month:'long', year:'numeric'});
    sel.appendChild(o);
  }
  PERIOD = sel.value;
  sel.onchange = () => { PERIOD = sel.value; render(); };

  // KPI по модели времени — только у руководителя отдела; владелец его
  // оценивает, ассистенты видят свои заёбы и экономию и могут оставить
  // отзыв о руководителе.
  const tabs = [];
  if (ME.role === 'lead') tabs.push({ id: 'kpi', name: 'Мой KPI' });
  if (ME.role === 'chief') tabs.push({ id: 'kpi', name: 'KPI руководителя' });
  if (ME.role === 'lead' || ME.role === 'chief') tabs.push({ id: 'team', name: 'Отдел' });
  if (ME.role === 'assistant') tabs.push({ id: 'me', name: 'Мои результаты' });
  if (ME.role === 'lead' || ME.role === 'chief') {
    tabs.push({ id: 'inbox', name: 'Приёмка' });
    tabs.push({ id: 'zaeby', name: 'Раздражители' });
    tabs.push({ id: 'admin', name: 'Люди и настройки' });
  }
  TAB = tabs[0].id;

  $('tabs').innerHTML = '';
  tabs.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'tab' + (t.id === TAB ? ' on' : '');
    b.textContent = t.name;
    b.onclick = () => {
      TAB = t.id;
      [...$('tabs').children].forEach((c) => c.classList.toggle('on', c === b));
      render();
    };
    $('tabs').appendChild(b);
  });

  render();
}

// ── рендер ──────────────────────────────────────────────────────────────────
async function render(){
  const v = $('view');
  v.innerHTML = '<p class="muted">Загружаю…</p>';
  $('periodSel').classList.toggle('hide', TAB === 'admin' || TAB === 'inbox');
  try {
    if (TAB === 'kpi')   return renderKpi(await api(`/kpi/board?period=${PERIOD}`), v);
    if (TAB === 'me')    return await renderProfile(await api(`/me?period=${PERIOD}`), v);
    if (TAB === 'team')  return renderTeam(await api(`/team?period=${PERIOD}`), v);
    if (TAB === 'inbox') return renderInbox(await api('/inbox'), v);
    if (TAB === 'zaeby') return renderZaeby(await api(`/zaeby?period=${PERIOD}`), v);
    if (TAB === 'admin') return renderAdmin(v);
  } catch (e) {
    v.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`;
  }
}

// ── Модель времени: Time to start / Time to fill ────────────────────────────
const TM = {
  done: { name: 'Выполнение', short: 'Выполнение', hint: 'сколько задач из взятых в работу доведено до сдачи' },
  quality: { name: 'Качество сдачи', short: 'Качество', hint: 'возвраты с проверки: первый почти бесплатно, дальше дороже' },
  t2a: { name: 'Время до принятия', short: 'До принятия', hint: 'от постановки до «Принята» — справочно, в KPI не входит' },
  t2s: { name: 'Время до старта', short: 'До старта', hint: 'от постановки до взятия в работу' },
  t2f: { name: 'Время решения',  short: 'Решение',  hint: 'от постановки до сдачи, без блокера, ожидания, проверки и «на потом»' },
};
const LEVEL_NAME = { 1: 'простые', 2: 'обычные', 3: 'сложные' };
// до принятия и до старта — без уровня, в работе — по уровням
const KEYS6 = ['done', 'quality', 't2s', 't2f1', 't2f2', 't2f3'];
const keyMetric = (k) => k.slice(0, 3);
const keyLevel = (k) => (k.length > 3 ? +k.slice(3) : null);
const keyTitle = (k) => (keyLevel(k) ? `${TM[keyMetric(k)].name} · уровень ${keyLevel(k)}` : TM[keyMetric(k)].name);
const STAGE_EMPTY = { t2a: 'не принята', t2s: 'не взята', t2f: 'не сдана' };
const STAGE_PAST = { t2a: 'принята', t2s: 'взята', t2f: 'сдана' };
// доля веса направления в итоговом проценте
const weightOf = (k, w) => (!w ? null : k.startsWith('t2f') ? w.work : w[k] ?? null);
const MARK_TXT = { minus: '−', plusminus: '+−', plus: '+', plus2: '++', plus3: '+++', plus4: '++++' };
const MARK_HINT = {
  minus: 'план сорван', plusminus: 'ниже плана', plus: 'в плане',
  plus2: 'выше плана', plus3: 'сильно выше плана', plus4: 'сверхплан',
};
// что показывать в графиках: весь отдел или человек, все уровни или один
let KPI_VIEW = { who: 'team', level: 0, chart: null };
let KPI_DATA = null;

/** Ссылка на задачу в YouGile. Клик по ней не должен открывать историю задачи. */
function ygLink(t){
  return t && t.url ? `<a class="yg" href="${esc(t.url)}" target="_blank" rel="noopener" title="Открыть в YouGile" onclick="event.stopPropagation()">↗</a>` : '';
}

function fmtH(h){
  if (h === null || h === undefined) return '—';
  if (h < 1) return Math.round(h * 60) + ' мин';
  const s = (Math.round(h * 10) / 10).toLocaleString('ru-RU');
  return h >= 16 ? `${s} ч (${(Math.round(h / 9 * 10) / 10).toLocaleString('ru-RU')} раб. дн)` : s + ' ч';
}
function pctClass(p){
  if (p === null || p === undefined) return 'muted';
  return p >= 100 ? 'pct-good' : p >= 80 ? 'pct-mid' : 'pct-bad';
}
function pctHtml(p){
  return p === null || p === undefined ? '<span class="muted">—</span>' : `<span class="${pctClass(p)}">${p} %</span>`;
}
function markHtml(mark, auto){
  if (!mark) return '<span class="muted">—</span>';
  return `<span class="mark m-${mark}${auto ? ' auto' : ''}" title="${auto ? 'предложение системы: ' : ''}${MARK_HINT[mark] || ''}">${MARK_TXT[mark] || mark}</span>`;
}
function monthName(period){
  const [y, m] = period.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
}
function monthShort(period){
  const [y, m] = period.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('ru-RU', { month: 'short' }).replace('.', '');
}

/** Столбики факта по месяцам, пунктир — план. Зелёный уложился, красный нет. */
function chartSvg(months, facts, plan, empty, unit){
  const W = 300, H = 120, padB = 22, padT = 16;
  const max = Math.max(plan || 0, ...facts.filter((v) => v !== null), 0.001) * 1.18;
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);
  const bw = 40, gap = (W - months.length * bw) / (months.length + 1);
  let out = '';
  months.forEach((p, i) => {
    const x = gap + i * (bw + gap);
    const f = facts[i];
    if (f === null || f === undefined) {
      // пустой месяц: либо задач не ставили, либо ни одна не дошла до нужной стадии
      out += `<rect x="${x}" y="${y(0) - 3}" width="${bw}" height="3" rx="1.5" class="b-none"/>`;
      out += `<text x="${x + bw / 2}" y="${y(0) - 15}" text-anchor="middle">${(empty && empty[i]) || 'нет задач'}</text>`;
    } else {
      const top = y(f), h = Math.max(2, y(0) - top);
      const bad = unit === '%' ? plan && f < plan : plan && f > plan;
      out += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="5" class="${bad ? 'b-over' : 'b-ok'}"/>`;
      // над узким столбиком — только часы, дни не помещаются
      const lbl = unit === '%' ? `${Math.round(f)} %` : f < 1 ? fmtH(f) : `${(Math.round(f * 10) / 10).toLocaleString('ru-RU')} ч`;
      out += `<text x="${x + bw / 2}" y="${top - 5}" text-anchor="middle" class="bv">${lbl}</text>`;
    }
    out += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${monthShort(p)}</text>`;
  });
  if (plan) {
    out += `<line x1="0" x2="${W}" y1="${y(plan)}" y2="${y(plan)}" class="plan"/>`;
    // Подпись плана — над линией. Когда план много меньше факта, линия лежит
    // у самой оси и подпись налезала бы на «нет задач» — тогда уводим её вверх.
    const low = y(plan) > H - padB - 22;
    out += `<text x="${W}" y="${low ? padT - 4 : y(plan) - 4}" text-anchor="end">${unit === '%' ? 'норма 100 %' : `план ${fmtH(plan)}`}${low ? ' ↓' : ''}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${out}</svg>`;
}

/** Шесть плашек: значение, план и процент. */
function sixHtml(metrics, percents, sla, counts, weights){
  return `<div class="six">${KEYS6.map((k) => {
    const m = keyMetric(k), l = keyLevel(k);
    const n = counts ? counts[k] : null;
    const w = weightOf(k, weights);
    const wLbl = w ? ` <span class="muted" title="вес в итоговом проценте">· вес ${w}${k.startsWith('t2f') ? ' на все уровни' : ''}</span>` : '';
    if (k === 'done' || k === 'quality') {
      const dn = counts && (k === 'done' ? counts.doneDetail : counts.qualityDetail);
      const sub = k === 'done'
        ? (dn ? `сдано ${dn.done} из взятых в этом месяце ${dn.taken}` : 'из взятых в работу')
        : (dn ? (dn.returns ? `возвратов ${dn.returns} по ${dn.returned} задачам из ${dn.count}` : `без возвратов, задач ${dn.count}`) : 'возвраты с проверки');
      return `<div class="m" title="${TM[k].hint}"${k === 'done' ? ' style="border-color:var(--accent)"' : ''}>
        <div class="k">${TM[k].short}${wLbl}</div>
        <div class="v ${pctClass(metrics[k])}">${metrics[k] === null || metrics[k] === undefined ? '—' : metrics[k] + ' %'}</div>
        <div class="p"><span class="muted">${sub}</span></div>
      </div>`;
    }
    return `<div class="m" title="${TM[m].hint}">
      <div class="k">${TM[m].short}${l ? ` · ${l}` : ''}${wLbl}</div>
      <div class="v">${fmtH(metrics[k])}</div>
      <div class="p">${pctHtml(percents[k])} <span class="muted">· норма ${fmtH(sla[k])}${n !== null && n !== undefined ? ` · задач ${n}` : ''}</span></div>
    </div>`;
  }).join('')}</div>`;
}

/** Часы задачи в месяце: серым — если в этот месяц она попала другой стадией. */
function hoursCell(t, m){
  if (t[m] !== null && t[m] !== undefined) return fmtH(t[m]);
  const all = t[m + '_all'];
  if (all !== null && all !== undefined) return `<span class="muted" title="${STAGE_PAST[m]} в другом месяце">${fmtH(all)}</span>`;
  return `<span class="muted">${STAGE_EMPTY[m]}</span>`;
}

/** Раскрываемый месяц: шесть метрик и список задач с часами. */
function monthHtml(m, sla, showWho, people){
  const who = (id) => (people.find((p) => p.id === id) || {}).name || '—';
  const counts = {};
  KEYS6.forEach((k) => { counts[k] = m.detail?.[k]?.count ?? 0; });
  counts.doneDetail = m.detail?.done;
  counts.qualityDetail = m.detail?.quality;
  const rows = m.tasks.map((t) => `
    <tr>
      <td><span class="lvl l${t.level}">${t.level}</span><span class="src" title="откуда уровень">${
        ({ sticker: 'стикер', model: 'модель', manual: 'руками', default: 'по размеру' })[t.level_src] || ''}</span></td>
      <td><strong>${esc(t.number || '')}</strong> ${esc(t.title)} ${ygLink(t)}</td>
      ${showWho ? `<td>${esc(who(t.assignee_id))}</td>` : ''}
      <td class="num">${hoursCell(t, 't2a')}</td>
      <td class="num">${hoursCell(t, 't2s')}</td>
      <td class="num">${hoursCell(t, 't2f')}</td>
    </tr>`).join('');
  return `<details class="month">
    <summary>${monthName(m.period)}
      <span class="sum-metrics">
        <span>принято <b>${m.acked ?? '—'}</b></span>
        <span>взято <b>${m.taken ?? m.count}</b></span>
        <span>сдано <b>${m.done ?? '—'}</b></span>
        <span>нормы <b>${m.avgPercent === null ? '—' : m.avgPercent + ' %'}</b></span>
      </span></summary>
    <div class="body">
      ${sixHtml(m.metrics, m.percents, sla, counts, m.weights)}
      ${m.tasks.length ? `<div class="tbl"><table style="min-width:0">
        <thead><tr><th style="width:90px">Уровень</th><th>Задача</th>${showWho ? '<th>Кто</th>' : ''}
          <th class="num" title="справочно, в KPI не входит">Принята через</th><th class="num">До старта</th><th class="num">Решение</th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : '<p class="muted">В этом месяце задач не ставилось.</p>'}
    </div>
  </details>`;
}

/** Графики и месяцы для выбранного среза — перерисовываются без запроса. */
function renderKpiSlice(){
  const d = KPI_DATA;
  const src = KPI_VIEW.who === 'team'
    ? { name: 'Весь отдел', months: d.lead.months, quarter: d.lead.quarter }
    : KPI_VIEW.who === 'lead'
      ? { name: d.lead.name, months: d.lead.ownMonths, quarter: d.lead.ownQuarter }
      : d.people.find((p) => p.id === KPI_VIEW.who);
  if (!src) return;
  const months = src.months;
  const keys = KPI_VIEW.level ? KEYS6.filter((k) => !keyLevel(k) || keyLevel(k) === KPI_VIEW.level) : KEYS6;
  const qm = src.quarter.metrics, qp = src.quarter.percents;

  $('kpiCharts').innerHTML = keys.map((k) => {
    const m = keyMetric(k), l = keyLevel(k);
    const facts = months.map((x) => x.metrics[k]);
    if (k === 'done' || k === 'quality') {
      const w = weightOf(k, d.lead.weights);
      return `<div class="card chart"${k === 'done' ? ' style="border-color:var(--accent)"' : ''}>
        <div class="lbl">${TM[k].name}${w ? ` · вес ${w}` : ''}</div>
        <div class="val ${pctClass(qm[k])}">${qm[k] === null || qm[k] === undefined ? '—' : qm[k] + ' %'}</div>
        <div class="sub">${TM[k].hint} · за квартал</div>
        ${chartSvg(months.map((x) => x.period), facts, 100, months.map(() => 'нет задач'), '%')}
      </div>`;
    }
    // задачи были, но стадия не наступила — это не «нет задач»
    const empty = months.map((x) => {
      const n = (x.tasks || []).filter((t) => (!l || t.level === l) && t[m] === null).length;
      return n ? `${STAGE_EMPTY[m].replace('а', 'о')} (${n})` : 'нет задач';
    });
    return `<div class="card chart clickable${KPI_VIEW.chart === k ? ' on' : ''}" data-chart="${k}" title="Показать задачи этой метрики">
      <div class="lbl">${keyTitle(k)} <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">▸ задачи</span></div>
      <div class="val">${fmtH(qm[k])} <span class="sub" style="font-size:14px">${pctHtml(qp[k])}</span></div>
      <div class="sub">${l ? `${LEVEL_NAME[l]} задачи, ` : 'все задачи, '}среднее за квартал · ${TM[m].hint}</div>
      ${chartSvg(months.map((x) => x.period), facts, d.sla[k], empty)}
    </div>`;
  }).join('');

  // Клик по метрике — какие задачи в неё вошли, по месяцам, с часами
  const who = (id) => ([...d.people, { id: d.lead.id, name: d.lead.name }].find((p) => p.id === id) || {}).name || '—';
  const showChart = (k) => {
    KPI_VIEW.chart = k;
    $('kpiCharts').querySelectorAll('[data-chart]').forEach((c) => c.classList.toggle('on', c.dataset.chart === k));
    const box = $('chartDetail');
    if (!k) { box.innerHTML = ''; return; }
    const m = keyMetric(k), l = keyLevel(k);
    const rows = months.flatMap((x) => (x.tasks || []).filter((t) => (!l || t.level === l) && t[m] !== null).map((t) => ({ ...t, period: x.period })))
      .sort((a, b) => (b[m] ?? -1) - (a[m] ?? -1));
    const st = { accepted: 'принята', review: 'на проверке', in_progress: 'в работе', open: 'не взята', blocked: 'блокер', waiting: 'в ожидании', shelved: 'отложена' };
    box.innerHTML = `<div class="card" style="margin-bottom:22px">
      <div class="row" style="margin-bottom:8px">
        <h3>${keyTitle(k)} · ${esc(src.name)}</h3><span class="spacer"></span>
        <button class="btn ghost sm" id="chartClose">Скрыть</button>
      </div>
      <p class="muted" style="margin-bottom:10px">${l ? LEVEL_NAME[l] + ' задачи' : 'Задачи'}, вошедшие в эту метрику за квартал, от самых долгих. Норма — ${fmtH(d.sla[k])}. Клик по задаче — её история.</p>
      ${rows.length ? `<div class="tbl"><table style="min-width:0">
        <thead><tr><th>Месяц</th><th>Задача</th>${KPI_VIEW.who === 'team' ? '<th>Кто</th>' : ''}<th>Статус</th><th class="num" title="справочно">Принята через</th><th class="num">До старта</th><th class="num">Решение</th></tr></thead>
        <tbody>${rows.map((t) => `<tr class="clickable" data-task="${esc(t.id)}">
          <td>${monthShort(t.period)}</td>
          <td><strong>${esc(t.number || '')}</strong> ${esc(t.title)} ${ygLink(t)}<span class="src">${({ sticker: 'стикер', model: 'модель', manual: 'руками', default: 'по размеру' })[t.level_src] || ''}</span></td>
          ${KPI_VIEW.who === 'team' ? `<td>${esc(who(t.assignee_id))}</td>` : ''}
          <td>${st[t.status] || t.status}</td>
          <td class="num ${t.t2a !== null && d.sla.t2a && t.t2a > d.sla.t2a ? 'pct-bad' : ''}">${hoursCell(t, 't2a')}</td>
          <td class="num ${t.t2s !== null && d.sla.t2s && t.t2s > d.sla.t2s ? 'pct-bad' : ''}">${hoursCell(t, 't2s')}</td>
          <td class="num ${t.t2f !== null && d.sla['t2f' + t.level] && t.t2f > d.sla['t2f' + t.level] ? 'pct-bad' : ''}">${hoursCell(t, 't2f')}</td>
        </tr>`).join('')}</tbody></table></div>` : '<p class="muted">Задач этого уровня в квартале нет.</p>'}
    </div>`;
    box.querySelectorAll('tr[data-task]').forEach((tr) => { tr.onclick = () => openTask(tr.dataset.task); });
    $('chartClose').onclick = () => showChart(null);
  };
  $('kpiCharts').querySelectorAll('[data-chart]').forEach((c) => {
    c.onclick = () => showChart(KPI_VIEW.chart === c.dataset.chart ? null : c.dataset.chart);
  });
  showChart(KPI_VIEW.chart && keys.includes(KPI_VIEW.chart) ? KPI_VIEW.chart : null);

  $('kpiMonths').innerHTML = months.map((m) => monthHtml(m, d.sla, KPI_VIEW.who === 'team', [...d.people, { id: d.lead.id, name: d.lead.name }])).join('');
  $('sliceTitle').textContent = src.name;
}

const scoreTxt = (v) => (v === null || v === undefined ? '—' : String(v).replace('.', ','));
const scoreCls = (v) => (v === null || v === undefined ? 'muted' : v >= 8 ? 'pct-good' : v >= 6 ? 'pct-mid' : 'pct-bad');

/**
 * KPI руководителя отдела за месяц. Оценка каждого — из модели времени,
 * руками её можно поправить. KPI — среднее оценок отдела вместе с самим
 * руководителем, премия — доля от максимума. Оценивает: руководитель —
 * ассистентов, владелец — всех.
 */
async function renderKpi(d, v){
  KPI_DATA = d;
  const chief = ME.role === 'chief';
  const L = d.lead;
  const validWho = ['team', 'lead', ...d.people.map((p) => p.id)];
  if (!validWho.includes(KPI_VIEW.who)) KPI_VIEW.who = 'team';
  const monthTitle = $('periodSel').selectedOptions[0]?.textContent || d.period;

  // ── карточки месяца
  const all = [{ name: L.name, score: L.own.score }, ...d.people.map((p) => ({ name: p.name, score: p.score }))]
    .filter((x) => x.score !== null && x.score !== undefined);
  const formula = all.length
    ? `(${all.map((x) => scoreTxt(x.score)).join(' + ')}) / ${all.length} = ${scoreTxt(L.score)}`
    : 'оценок за месяц нет';
  const head = `<div class="grid g4" style="margin-bottom:22px">
    <div class="card metric"><div class="lbl">KPI за месяц</div>
      <div class="val ${scoreCls(L.score)}">${scoreTxt(L.score)}<span style="font-size:16px;color:var(--fg-3);font-weight:600"> / 10</span></div>
      <div class="sub">${esc(formula)}</div></div>
    <div class="card metric"><div class="lbl">Премия</div>
      <div class="val">${money(L.bonus)}</div>
      <div class="sub">из ${money(L.max)} · ${L.score === null ? 'нет оценок' : `${money(L.max)} × ${scoreTxt(L.score)} / 10`}</div></div>
    <div class="card metric"><div class="lbl">Своя оценка</div>
      <div class="val ${scoreCls(L.own.score)}">${scoreTxt(L.own.score)}</div>
      <div class="sub">${L.own.manual !== null ? `руками${L.own.actor ? `, ${esc(L.own.actor)}` : ''} · авто ${scoreTxt(L.own.auto)}` : `авто · план ${L.own.avgPercent ?? '—'} %, задач ${L.own.tasks}`}</div></div>
    <div class="card metric"><div class="lbl">Аттестация · ${esc(d.quarter)}</div>
      <div class="val">${markHtml(L.result?.mark || L.quarter.markAuto, !L.result)}</div>
      <div class="sub">${L.result ? `закрыта ${fmtDate(L.result.closed_at)}` : `предложение по плану отдела ${L.quarter.avgPercent ?? '—'} %`}</div></div>
  </div>`;

  // ── таблица оценок
  const canScore = (p) => (p.role === 'lead' ? chief : true);
  const scoreRow = (p) => `
    <tr data-uid="${esc(p.id)}" data-open="${esc(p.id)}" class="clickable" title="Показать, из чего сложилась цифра"${p.role === 'lead' ? ' style="background:var(--surface-2)"' : ''}>
      <td><strong>${esc(p.name)}</strong>${p.role === 'lead' ? ' <span class="tag t-blue">рук. отдела</span>' : ''}
        <span class="muted" style="font-size:12px;margin-left:6px">▸ подробно</span></td>
      <td class="num">${p.acked ?? 0} / ${p.taken ?? 0} / ${p.done ?? 0}<div class="muted" style="font-size:12px">висит ${p.open ?? '—'}</div></td>
      <td class="num">${pctHtml(p.avgPercent)}<div class="muted" style="font-size:12px">выполнение ${p.metrics?.done === null || p.metrics?.done === undefined ? '—' : p.metrics.done + ' %'}${p.metrics?.quality !== null && p.metrics?.quality !== undefined && p.metrics.quality < 100 ? ` · качество ${p.metrics.quality} %` : ''}</div></td>
      <td class="num">${scoreTxt(p.auto)}</td>
      <td class="num">${canScore(p)
        ? `<input type="number" min="0" max="10" step="0.5" inputmode="decimal" class="score-in ${scoreCls(p.score)}"
             data-manual="${esc(p.id)}" data-auto="${p.auto ?? ''}" value="${p.score ?? ''}" placeholder="—"
             title="Измените цифру — сохранится сама. Очистите поле — вернётся автоматическая">
           <div class="muted" style="font-size:11.5px;margin-top:2px">${p.manual !== null ? 'руками' : 'авто'}</div>`
        : `<strong class="${scoreCls(p.score)}" style="font-size:17px">${scoreTxt(p.score)}</strong>`}</td>
    </tr>
    <tr class="detail-row hide" data-detail="${esc(p.id)}"><td colspan="5"><div class="body"></div></td></tr>`;
  const rows = [scoreRow({ ...L.own, id: L.id, name: L.name, role: 'lead' }), ...d.people.map((p) => scoreRow({ ...p, role: 'assistant' }))].join('');

  // ── очередь на проверке: это время руководителя, в оценки оно не идёт
  const rv = d.review || { pending: [], norm: 8 };
  const reviewBlock = `
    <h2 style="margin-bottom:6px">Проверка</h2>
    <p class="muted" style="margin-bottom:12px">Пока задача на проверке, её время не идёт в оценку ассистента — проверяет ${chief ? 'руководитель' : 'владелец'}.
      Это очередь проверяющего: норма ${fmtH(rv.norm)}, дольше — в утреннем напоминании.</p>
    <div class="grid g4" style="margin-bottom:12px">
      <div class="card metric"><div class="lbl">Ждут решения</div>
        <div class="val ${rv.pending.length ? '' : 'muted'}">${rv.pending.length}</div>
        <div class="sub">${rv.overdue ? `<span class="pct-bad">дольше нормы: ${rv.overdue}</span>` : 'все в норме'}</div></div>
      <div class="card metric"><div class="lbl">Дольше всех</div>
        <div class="val small ${rv.pending.length && rv.pending[0].hours > rv.norm ? 'pct-bad' : ''}">${rv.pending.length ? fmtH(rv.pending[0].hours) : '—'}</div>
        <div class="sub">${rv.pending.length ? esc(String(rv.pending[0].title).slice(0, 38)) : 'очередь пуста'}</div></div>
      <div class="card metric"><div class="lbl">Проверено за месяц</div>
        <div class="val">${rv.checked ?? 0}</div>
        <div class="sub">принято в ${esc(monthTitle)}</div></div>
      <div class="card metric"><div class="lbl">Среднее ожидание</div>
        <div class="val small ${rv.avg !== null && rv.avg !== undefined && rv.avg > rv.norm ? 'pct-bad' : ''}">${rv.avg === null || rv.avg === undefined ? '—' : fmtH(rv.avg)}</div>
        <div class="sub">медиана ${rv.median === null || rv.median === undefined ? '—' : fmtH(rv.median)}${rv.max ? ` · максимум ${fmtH(rv.max)}` : ''}</div></div>
    </div>
    <p class="muted" style="margin-bottom:22px">${rv.pending.length
      ? `Список очереди — на вкладке <a href="#" id="toInbox">Приёмка</a>: там видно, сколько каждая ждёт, и кнопки «принято» / «вернуть».`
      : 'Очередь пуста.'}</p>`;

  // ── срезы
  const whoSeg = `<div class="seg" id="segWho">
    <button data-who="team" class="${KPI_VIEW.who === 'team' ? 'on' : ''}">Весь отдел</button>
    <button data-who="lead" class="${KPI_VIEW.who === 'lead' ? 'on' : ''}">${esc(L.name)}</button>
    ${d.people.map((p) => `<button data-who="${esc(p.id)}" class="${KPI_VIEW.who === p.id ? 'on' : ''}">${esc(p.name)}</button>`).join('')}
  </div>`;
  const lvlSeg = `<div class="seg" id="segLvl">
    <button data-lvl="0" class="${KPI_VIEW.level === 0 ? 'on' : ''}">Все уровни</button>
    ${[1, 2, 3].map((l) => `<button data-lvl="${l}" class="${KPI_VIEW.level === l ? 'on' : ''}">Уровень ${l}</button>`).join('')}
  </div>`;

  // ── квартал: отзывы и аттестация
  const reviews = L.reviews.map((r) => `<div class="review">
    <div class="h"><b>${({ self: 'Самооценка', peer: 'Отзыв ассистента', chief: 'Отзыв владельца' })[r.kind] || r.kind}</b>
      ${r.author ? `· ${esc(r.author)}` : ''} · ${fmtDate(r.created_at)}
      ${r.mark ? markHtml(r.mark) : ''}
      ${(r.author_id === ME.id || chief) ? `<button class="btn ghost sm" style="min-height:26px;margin-left:auto" data-delrev="${r.id}">удалить</button>` : ''}
    </div>
    ${r.text ? esc(r.text) : '<span class="muted">без текста</span>'}
  </div>`).join('') || '<p class="muted">Отзывов за квартал пока нет.</p>';

  const mine = L.reviews.find((r) => r.author_id === ME.id);
  const markSel = (id, cur) => `<select id="${id}" style="width:auto;min-width:140px">
    <option value="">без оценки</option>
    ${d.marks.map((m) => `<option value="${m.id}"${cur === m.id ? ' selected' : ''}>${m.label} — ${MARK_HINT[m.id]}</option>`).join('')}
  </select>`;
  const reviewForm = `<div class="card" style="margin-top:12px;padding:16px">
    <h4 style="margin-bottom:8px">${chief ? 'Отзыв владельца' : 'Самооценка за квартал'}</h4>
    <textarea id="rev_text" placeholder="${chief
      ? 'Что было хорошо, что стоит поменять — руководитель это увидит'
      : 'Что получилось за три месяца, что нет, что хочу изменить'}">${esc(mine?.text || '')}</textarea>
    <div class="row" style="margin-top:8px">${markSel('rev_mark', mine?.mark)}
      <button class="btn ghost" id="sendReview">${mine ? 'Обновить' : 'Отправить'}</button></div>
  </div>`;

  const closeBlock = !chief ? '' : (L.result
    ? `<div class="why">Аттестация закрыта ${fmtDate(L.result.closed_at)}: оценка ${markHtml(L.result.mark)},
        план отдела ${L.result.plan_percent ?? '—'} %${L.result.note ? ` · ${esc(L.result.note)}` : ''}
        <div style="margin-top:8px"><button class="btn ghost sm" id="reopen">Переоткрыть</button></div></div>`
    : `<div class="card" style="margin-top:12px;padding:16px">
        <h4 style="margin-bottom:8px">Аттестация за квартал</h4>
        <p class="muted" style="margin-bottom:10px">Система предлагает ${markHtml(L.quarter.markAuto, true)} по проценту плана отдела
          ${L.quarter.avgPercent ?? '—'} %. Итоговую ставите вы — с учётом отзывов. Денег за ней нет, премия считается помесячно;
          это ориентир для пересмотра норм.</p>
        <div class="row">
          ${markSel('close_mark', L.quarter.markAuto)}
          <input id="close_note" placeholder="комментарий (необязательно)" style="flex:1;min-width:200px">
          <button class="btn" id="closeQ">Закрыть аттестацию</button>
        </div>
      </div>`);

  // ── нормы
  const quarterOptions = () => {
    const out = [];
    const [y0, m0] = d.period.split('-').map(Number);
    const q0 = Math.floor((m0 - 1) / 3) + 1;
    for (let i = -4; i <= 2; i++) {
      let q = q0 + i, y = y0;
      while (q < 1) { q += 4; y -= 1; }
      while (q > 4) { q -= 4; y += 1; }
      const val = `${y}-Q${q}`;
      out.push(`<option value="${val}"${val === d.quarter ? ' selected' : ''}>${q}-й квартал ${y}</option>`);
    }
    return out.join('');
  };
  const slaBlock = `
    <h2 style="margin:26px 0 6px">Нормы на квартал</h2>
    <p class="muted" style="margin-bottom:12px">Плановые значения в рабочих часах (день 9:00–18:00 по Москве, 9 часов). Из процента плана выводится автоматическая оценка:
      60 % — 6, 100 % и выше — 10. Действуют с выбранного квартала и дальше, прошлые кварталы считаются по своим нормам.</p>
    <div class="card">
      <div class="sla-grid">
        <div></div><div class="hd">Уровень 1<br><span style="text-transform:none;font-weight:500">простые</span></div>
        <div class="hd">Уровень 2<br><span style="text-transform:none;font-weight:500">обычные</span></div>
        <div class="hd">Уровень 3<br><span style="text-transform:none;font-weight:500">сложные</span></div>
        <div class="rl">${TM.t2a.name}<div class="muted" style="font-size:12px;font-weight:500">справочно</div></div>
        <input id="sla_t2a" type="number" step="0.25" min="0.25" value="${d.sla.t2a ?? ''}"><div class="muted" style="grid-column:span 2;font-size:12.5px">рабочих часов от постановки до «Принята» — в KPI не входит</div>
        <div class="rl">${TM.t2s.name}<div class="muted" style="font-size:12px;font-weight:500">для всех уровней</div></div>
        <input id="sla_t2s" type="number" step="0.5" min="0.5" value="${d.sla.t2s ?? ''}"><div class="muted" style="grid-column:span 2;font-size:12.5px">рабочих часов от постановки до «В работе»</div>
        <div class="rl">${TM.t2f.name}</div>
        ${[1, 2, 3].map((l) => `<input id="sla_t2f${l}" type="number" step="0.5" min="0.5" value="${d.sla['t2f' + l] ?? ''}">`).join('')}
      </div>
      <div class="row" style="margin-top:14px">
        <span class="muted">Действуют с</span>
        <select id="slaFrom" style="width:auto">${quarterOptions()}</select>
        <span class="muted">· сверхплан от</span>
        <input id="overplan" type="number" min="100" max="300" value="${d.overplan}" style="width:90px"><span class="muted">%</span>
        <span class="muted">· максимум премии</span>
        <input id="kpiMax" type="number" min="0" step="1000" value="${L.max}" style="width:110px"><span class="muted">₽</span>
        <button class="btn" id="saveSla">Сохранить</button>
        <span id="slaMsg" class="muted"></span>
      </div>
    </div>`;

  v.innerHTML = `
    <div class="row" style="margin-bottom:6px">
      <h1>${chief ? `KPI руководителя · ${esc(L.name)}` : 'Мой KPI'} · ${esc(monthTitle)}</h1>
    </div>
    <p class="muted" style="margin-bottom:16px">Время идёт от постановки задачи в «Добавлена» и останавливается на паузах: блокер, ожидание, проверка, «на потом», «на контроле».
      В KPI входят решение задачи (вес 50), выполнение — сколько из взятых в этом месяце уже сдано (20), время до старта (20) и качество сдачи по возвратам с проверки (10).
      Обгон нормы засчитывается до 120 %: быстро взять задачу нельзя «в зачёт» за медленное решение.
      Перенос в «Принята» ускоряет работу, но в KPI не входит и цифры не поднимает. Оценка каждого 0–10 — из итогового процента, руками её можно поправить.
      KPI руководителя — среднее оценок отдела вместе с его собственной. Премия — доля от максимума, заёбы и экономия отдельно.</p>
    ${head}

    <h2 style="margin-bottom:6px">Оценки за месяц</h2>
    <p class="muted" style="margin-bottom:12px">Принято — сколько задач человек перенёс в «Принята» в этом месяце, взято — сколько взял в работу, сдано — сколько сдал; «висит» — открыто на нём сейчас.
      Выполнение норм — насколько его скорость укладывается в план (100 % и выше — в норме). Оценка по скорости считается из этого; итоговую можно поменять прямо в поле — сохранится сама, пустое поле вернёт автоматическую.
      ${chief ? 'Вы ставите всем, включая руководителя.' : 'Оценку вам ставит владелец.'} Клик по строке — из чего сложились цифры.</p>
    <div class="tbl" style="margin-bottom:22px"><table id="kpiTable">
      <thead><tr><th>Сотрудник</th><th class="num">Принято / взято / сдано<br>за месяц</th><th class="num">Выполнение<br>и скорость</th><th class="num">Оценка<br>по скорости</th><th class="num">Итоговая оценка<br><span style="text-transform:none;letter-spacing:0;font-weight:500">можно поправить</span></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>

    ${reviewBlock}

    <div class="row" style="margin-bottom:12px">
      <h2>Скорость по месяцам · <span id="sliceTitle"></span></h2><span class="spacer"></span>${whoSeg}${lvlSeg}
    </div>
    <div class="charts" id="kpiCharts" style="margin-bottom:22px"></div>
    <div id="chartDetail"></div>

    <h2 style="margin-bottom:10px">Месяцы квартала</h2>
    <div id="kpiMonths" style="margin-bottom:22px"></div>

    <h2 style="margin-bottom:10px">Отзывы и аттестация · ${esc(d.quarter)}</h2>
    ${reviews}
    ${reviewForm}
    ${closeBlock}
    ${slaBlock}`;

  renderKpiSlice();

  // ── обработчики
  // Очередь на проверке: клик по строке открывает историю задачи
  v.querySelectorAll('tr[data-task]').forEach((tr) => { tr.onclick = () => openTask(tr.dataset.task); });
  if ($('toInbox')) {
    $('toInbox').onclick = (e) => {
      e.preventDefault();
      const tab = [...$('tabs').children].find((b) => b.textContent === 'Приёмка');
      if (tab) tab.click();
    };
  }

  // Клик по имени раскрывает, из чего сложилась цифра: шесть метрик месяца,
  // задачи месяца с часами, что висит сейчас и что закрыто.
  const detailFor = (id) => {
    const isLead = id === L.id;
    const p = isLead ? { ...L.own, id: L.id, name: L.name } : d.people.find((x) => x.id === id);
    const months = isLead ? L.ownMonths : p.months;
    const month = (months || []).find((m) => m.period === d.period);
    return { p, month, isLead };
  };
  const monthTaskRows = (tasks) => tasks.map((t) => `
    <tr class="clickable" data-task="${esc(t.id)}">
      <td><span class="lvl l${t.level}">${t.level}</span><span class="src">${({ sticker: 'стикер', model: 'модель', manual: 'руками', default: 'по размеру' })[t.level_src] || ''}</span></td>
      <td><strong>${esc(t.number || '')}</strong> ${esc(t.title)} ${ygLink(t)}</td>
      <td>${({ accepted: 'принята', review: 'на проверке', in_progress: 'в работе', open: 'не взята', blocked: 'блокер', waiting: 'в ожидании', shelved: 'отложена' })[t.status] || t.status}</td>
      <td class="num">${hoursCell(t, 't2a')}</td>
      <td class="num">${hoursCell(t, 't2s')}</td>
      <td class="num">${hoursCell(t, 't2f')}</td>
    </tr>`).join('');

  v.querySelectorAll('tr[data-open]').forEach((td) => {
    td.onclick = async (ev) => {
      if (ev.target.closest('input, a, button')) return; // поле оценки и ссылки — не раскрытие
      const id = td.dataset.open;
      const row = v.querySelector(`tr[data-detail="${CSS.escape(id)}"]`);
      const body = row.querySelector('.body');
      const wasHidden = row.classList.contains('hide');
      row.classList.toggle('hide');
      if (!wasHidden || body.dataset.loaded) return;
      body.dataset.loaded = '1';

      const { p, month, isLead } = detailFor(id);
      const counts = {};
      KEYS6.forEach((k) => { counts[k] = month?.detail?.[k]?.count ?? 0; });
      counts.doneDetail = month?.detail?.done;
      counts.qualityDetail = month?.detail?.quality;
      const w = p.weights || d.lead.weights || {};
      const dn = month?.detail?.done;
      body.innerHTML = `
        <h4 style="margin:10px 0 4px">Из чего оценка за ${esc(monthTitle)}</h4>
        <p class="muted" style="margin-bottom:8px">Итог <b>${p.avgPercent ?? '—'} %</b> → авто <b>${scoreTxt(p.auto)}</b>.
          Направления взвешены: решение ${w.work ?? 50}, выполнение ${w.done ?? 20}, до старта ${w.t2s ?? 20}, качество сдачи ${w.quality ?? 10}. Обгон нормы засчитывается не выше ${d.percentCap ?? 120} %.
          Время до принятия показывается справочно и в расчёт не входит — перенос карточки в «Принята» цифру не поднимает.
          Выполнение${dn ? ` — сдано ${dn.done} из взятых ${dn.taken}` : ''}: только доведённая до сдачи задача считается сделанной.
          Задача, взятая в работу и висящая дольше нормы, попадает в «решение» уже сейчас, по текущему времени.
          Процент по времени = норма / факт, время на паузах вычтено. Задачи с приоритетом 30 не считаются.</p>
        ${sixHtml(p.metrics || {}, p.percents || {}, d.sla, counts, p.weights || d.lead.weights)}
        <h4 style="margin:6px 0 8px">Принято, взято или сдано в ${esc(monthTitle)} · ${month ? month.tasks.length : 0}</h4>
        <p class="muted" style="margin-bottom:8px">Серым — часы стадии из другого месяца.</p>
        ${month && month.tasks.length ? `<div class="tbl" style="margin-bottom:14px"><table style="min-width:0">
          <thead><tr><th style="width:90px">Уровень</th><th>Задача</th><th>Статус</th><th class="num" title="справочно">Принята через</th><th class="num">До старта</th><th class="num">Решение</th></tr></thead>
          <tbody>${monthTaskRows(month.tasks)}</tbody></table></div>` : '<p class="muted">В этом месяце ничего не принято, не взято и не сдано.</p>'}
        <div id="person_more_${esc(id)}"><p class="muted">Загружаю, что висит и что закрыто…</p></div>`;
      body.querySelectorAll('tr[data-task]').forEach((tr) => { tr.onclick = () => openTask(tr.dataset.task); });

      try {
        const prof = await api(`/person/${encodeURIComponent(id)}?period=${d.period}`);
        const box = $(`person_more_${id}`);
        box.innerHTML = `
          <h4 style="margin:6px 0 8px">Висит сейчас · ${prof.openTasks.length}</h4>
          ${prof.openTasks.length ? taskTable(prof.openTasks) : '<p class="muted">Открытых задач нет.</p>'}
          <h4 style="margin:14px 0 8px">Закрыто в ${esc(monthTitle)} · ${prof.tasks.length}</h4>
          ${prof.tasks.length ? taskTable(prof.tasks) : '<p class="muted">В этом месяце ничего не закрыто.</p>'}
          <p class="muted" style="margin-top:8px">Здесь — по дате закрытия, выше — по дате постановки, поэтому списки не совпадают. Клик по задаче открывает её историю.</p>`;
      } catch (e) {
        $(`person_more_${id}`).innerHTML = `<p class="err">${esc(e.message)}</p>`;
      }
    };
  });

  // Оценка сохраняется сама: по Enter или когда ушли из поля.
  // Пустое поле или цифра, равная автоматической, — снимаем ручную.
  v.querySelectorAll('[data-manual]').forEach((i) => {
    const save = async () => {
      const raw = i.value.trim().replace(',', '.');
      const auto = i.dataset.auto === '' ? null : +i.dataset.auto;
      const manual = raw === '' || (auto !== null && +raw === auto) ? null : +raw;
      if (manual !== null && !(manual >= 0 && manual <= 10)) { i.value = ''; return alert('Оценка от 0 до 10'); }
      i.disabled = true;
      try {
        await api('/kpi/score', { method: 'POST', body: JSON.stringify({ user_id: i.dataset.manual, period: d.period, manual }) });
        render();
      } catch (e) { i.disabled = false; alert(e.message); }
    };
    i.onchange = save;
    i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); i.blur(); } };
  });

  const pickWho = (who) => {
    KPI_VIEW.who = who;
    v.querySelectorAll('#segWho button').forEach((x) => x.classList.toggle('on', x.dataset.who === who));
    renderKpiSlice();
  };
  v.querySelectorAll('#segWho button').forEach((b) => { b.onclick = () => pickWho(b.dataset.who); });
  v.querySelectorAll('#segLvl button').forEach((b) => {
    b.onclick = () => {
      KPI_VIEW.level = +b.dataset.lvl;
      v.querySelectorAll('#segLvl button').forEach((x) => x.classList.toggle('on', x === b));
      renderKpiSlice();
    };
  });

  $('sendReview').onclick = async () => {
    try {
      await api('/kpi/reviews', { method: 'POST', body: JSON.stringify({
        quarter: d.quarter, text: $('rev_text').value, mark: $('rev_mark').value || null,
      }) });
      render();
    } catch (e) { alert(e.message); }
  };
  v.querySelectorAll('[data-delrev]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Удалить отзыв?')) return;
      await api('/kpi/reviews/' + b.dataset.delrev, { method: 'DELETE' });
      render();
    };
  });
  if ($('closeQ')) {
    $('closeQ').onclick = async () => {
      const mark = $('close_mark').value;
      if (!mark) return alert('Выберите оценку');
      if (!confirm(`Закрыть аттестацию за ${d.quarter} с оценкой ${MARK_TXT[mark]}?`)) return;
      try {
        await api('/kpi/quarter/close', { method: 'POST', body: JSON.stringify({ quarter: d.quarter, mark, note: $('close_note').value }) });
        render();
      } catch (e) { alert(e.message); }
    };
  }
  if ($('reopen')) {
    $('reopen').onclick = async () => {
      if (!confirm('Переоткрыть аттестацию?')) return;
      await api('/kpi/quarter/reopen', { method: 'POST', body: JSON.stringify({ quarter: d.quarter }) });
      render();
    };
  }

  $('saveSla').onclick = async () => {
    const values = {};
    KEYS6.forEach((k) => { values[k] = +$('sla_' + k).value; });
    try {
      await api('/kpi/sla', { method: 'POST', body: JSON.stringify({ quarter: $('slaFrom').value, values }) });
      await api('/admin/settings', { method: 'POST', body: JSON.stringify({
        overplan_percent: String(+$('overplan').value || 120),
        lead_kpi_max: String(+$('kpiMax').value || 50000),
      }) });
      $('slaMsg').textContent = 'Сохранено';
      render();
    } catch (e) { $('slaMsg').textContent = e.message; }
  };
}

/**
 * Ассистент: сверх оклада — только призы за заёбы и комиссия с экономии.
 * Плюс отзыв о руководителе отдела, по желанию.
 */
async function renderProfile(p, v){
  let rv = null;

  const reviewBlock = rv ? `
    <div class="card" style="margin-bottom:22px">
      <h3 style="margin-bottom:4px">Отзыв о руководителе · ${esc(rv.lead.name)}</h3>
      <p class="muted" style="margin-bottom:12px">По желанию, раз в квартал. Владелец увидит его при подведении итога квартала ${esc(rv.quarter)}.
        Прочитают только руководитель отдела и владелец.</p>
      ${rv.review ? `<div class="review"><div class="h"><b>Мой отзыв</b> · ${fmtDate(rv.review.created_at)} ${rv.review.mark ? markHtml(rv.review.mark) : ''}
        <button class="btn ghost sm" style="min-height:26px;margin-left:auto" data-delrev="${rv.review.id}">удалить</button></div>${esc(rv.review.text || '')}</div>` : ''}
      <textarea id="peer_text" placeholder="Что руководитель делает хорошо, где помогает, что стоило бы подтянуть">${esc(rv.review?.text || '')}</textarea>
      <div class="row" style="margin-top:8px">
        <select id="peer_mark" style="width:auto;min-width:140px"><option value="">без оценки</option>
          ${rv.marks.map((m) => `<option value="${m.id}"${rv.review?.mark === m.id ? ' selected' : ''}>${m.label} — ${MARK_HINT[m.id]}</option>`).join('')}</select>
        <button class="btn ghost" id="peerSend">${rv.review ? 'Обновить' : 'Отправить'}</button>
      </div>
    </div>` : '';

  v.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div><h1>${esc(p.user.name)}</h1><p class="muted">${p.tasks.length} закрытых задач, ${p.openTasks.length} в работе</p></div>
      <div class="spacer"></div>
      <div class="card" style="padding:14px 20px">
        <div class="money">${money(p.money.total)}</div>
        <div class="muted">сверх оклада за период</div>
      </div>
    </div>

    <div class="grid g4" style="margin-bottom:22px">
      <div class="card"><div class="lbl muted">Призы за заёбы</div><div class="money">${money(p.money.zaeb)}</div></div>
      <div class="card"><div class="lbl muted">Комиссия с экономии</div><div class="money">${money(p.money.savingPay)}</div><div class="muted">с ${money(p.money.savingSum)}</div></div>
      <div class="card"><div class="lbl muted">Оклад</div><div class="money">${money(p.money.salary)}</div></div>
      <div class="card"><div class="lbl muted">Итого</div><div class="money">${money(p.money.salary + p.money.total)}</div></div>
    </div>

    ${reviewBlock}

    <h2 style="margin-bottom:12px">Задачи за период</h2>
    ${taskTable(p.tasks.concat(p.openTasks))}
  `;

  if ($('peerSend')) {
    $('peerSend').onclick = async () => {
      try {
        await api('/kpi/reviews', { method: 'POST', body: JSON.stringify({
          quarter: rv.quarter, text: $('peer_text').value, mark: $('peer_mark').value || null,
        }) });
        render();
      } catch (e) { alert(e.message); }
    };
  }
  v.querySelectorAll('[data-delrev]').forEach((b) => {
    b.onclick = async () => {

      await api('/kpi/reviews/' + b.dataset.delrev, { method: 'DELETE' });
      render();
    };

}

function quarterOfPeriod(period){
  const [y, m] = String(period).split('-').map(Number);
  return `${y}-Q${Math.floor((m - 1) / 3) + 1}`;
}

function taskTable(tasks){
  if (!tasks.length) return '<div class="card"><p class="muted">За этот период задач нет.</p></div>';
  const rows = tasks.map((t) => {
    const st = {
      accepted:'<span class="tag t-green">принята</span>',
      review:'<span class="tag t-amber">на проверке</span>',
      in_progress:'<span class="tag t-blue">в работе</span>',
      open:'<span class="tag t-grey">не взята</span>',
      blocked:'<span class="tag t-grey">блокер</span>',
      waiting:'<span class="tag t-grey">в ожидании</span>',
      shelved:'<span class="tag t-grey">отложена</span>',
      failed:'<span class="tag t-red">сорвана</span>',
      returned:'<span class="tag t-red">возвращена</span>',
    }[t.status] || t.status;

    return `<tr class="clickable" data-task="${esc(t.id)}">
      <td>${t.level ? `<span class="lvl l${t.level}" style="margin-right:6px">${t.level}</span>` : ''}${t.number ? `<strong>${esc(t.number)}</strong> ` : ''}<strong>${esc(t.title)}</strong> ${ygLink(t)}${t.returns ? ` <span class="tag t-amber">возвратов: ${t.returns}</span>` : ''}${t.priority === 30 ? ' <span class="tag t-grey" title="приоритет 30 — в модели времени не считается">на месяц</span>' : ''}</td>
      <td>${st}</td>
      <td class="num">${fmtDate(t.createdAt)}</td>
      <td class="num">${t.takenAt ? t.timing.toTakeHuman : (t.waitingHours !== null && t.waitingHours !== undefined
        ? `<span class="pct-bad">не взята уже ${fmtH(t.waitingHours)}</span>` : '<span class="muted">не бралась</span>')}</td>
      <td class="num">${t.open && t.inWorkHours !== null && t.inWorkHours !== undefined
        ? `<span class="pct-mid">в работе уже ${fmtH(t.inWorkHours)}</span>` : t.timing.toDoHuman}</td>
      <td class="num">${t.timing.overdueHuman
        ? `<span class="pct-bad">${t.open ? 'просрочена на ' : '+'}${t.timing.overdueHuman}</span>`
        : t.timing.leftHuman ? `<span class="muted">осталось ${t.timing.leftHuman}</span>`
        : t.deadline ? '<span class="pct-good">в срок</span>' : '<span class="muted">без срока</span>'}</td>
    </tr>`;
  }).join('');

  const html = `<div class="tbl"><table>
    <thead><tr>
      <th>Задача</th><th>Статус</th><th class="num">Поставлена</th>
      <th class="num" title="рабочих часов от постановки до взятия в работу">Взята через</th><th class="num" title="рабочих часов в работе, без блокера и ожидания">Делалась</th><th class="num" title="по приоритету, в рабочих часах, без блокера и ожидания">Срок</th>
    </tr></thead><tbody>${rows}</tbody>
  </table></div>`;

  setTimeout(() => {
    document.querySelectorAll('tr[data-task]').forEach((tr) => {
      tr.onclick = () => openTask(tr.dataset.task);
    });
  }, 0);
  return html;
}

async function openTask(id){
  let data;
  try { data = await api(`/events/${id}`); } catch (e) { return alert(e.message); }
  const t = data.task, ev = data.events;

  const canAccept = ME.role === 'lead' || ME.role === 'chief';
  const actions = canAccept && t.status === 'review'
    ? `<div class="row" style="margin-top:16px">
         <button class="btn" data-act="accept">Принято</button>
         <button class="btn danger" data-act="return">Вернуть</button>
       </div>`
    : '';

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <div class="row"><h2>${esc(t.title)}</h2><div class="spacer"></div>
      <button class="btn ghost sm" data-act="close">Закрыть</button></div>
    ${t.url ? `<p class="muted"><a href="${esc(t.url)}" target="_blank" rel="noopener">Открыть в YouGile →</a></p>` : ''}

    <div class="why" style="margin-top:14px">
      <b>Тайминги</b><br>
      Поставлена: ${fmtDate(t.createdAt)}<br>
      Принята: ${t.ackedAt ? `${fmtDate(t.ackedAt)} — через <b>${fmtH(t.t2aHours)}</b>` : t.takenAt ? `сразу в работу — через <b>${fmtH(t.t2aHours)}</b>` : '<b>ещё нет</b>'}<br>
      Взята в работу: ${t.takenAt ? `${fmtDate(t.takenAt)} — через <b>${t.t2sHours !== null && t.t2sHours !== undefined ? fmtH(t.t2sHours) : t.timing.toTakeHuman}</b>${t.ackedAt ? ' после принятия' : ''}` : '<b>не бралась</b> — карточка не была в «В работе»'}<br>
      Сдана: ${fmtDate(t.submittedAt || t.doneAt)}${t.timing.toDoHuman !== '—' ? ` — ${t.open ? 'в работе уже' : 'делалась'} <b>${t.timing.toDoHuman}</b>` : ''}<br>
      Закрыта: ${fmtDate(t.doneAt)}${t.reviewHours ? ` — на проверке <b>${fmtH(t.reviewHours)}</b> <span class="muted">(время руководителя, в оценку не идёт)</span>` : ''}<br>
      Срок: ${fmtDate(t.deadline)}${t.timing.overdueHuman ? ` — <span style="color:var(--red)">просрочка ${t.timing.overdueHuman}</span>` : ''}<br>
      <span class="muted">Время московское. Все интервалы — в рабочих часах (день 9:00–18:00), время на проверке, в блокере и ожидании вычтено${t.priority ? ` · приоритет ${t.priority}` : ''}${t.level ? ` · уровень ${t.level}` : ''}</span>
      ${t.returns ? `<br>Возвратов с проверки: <b>${t.returns}</b>` : ''}
    </div>

    ${actions}

    <h3 style="margin-top:20px">Что происходило</h3>
    <ul class="timeline">
      ${ev.length ? ev.map((e) => `<li><b>${esc(labelEvent(e.type))}</b>${e.note ? ' — ' + esc(e.note) : ''}
        <div class="t">${fmtDate(e.at)}${e.actor ? ' · ' + esc(e.actor) : ''} · ${esc(e.source)}</div></li>`).join('')
      : '<li class="muted">Событий пока нет</li>'}
    </ul>
  </div>`;

  bg.onclick = async (e) => {
    const act = e.target.dataset?.act;
    if (!act) { if (e.target === bg) bg.remove(); return; }
    if (act === 'close') return bg.remove();
    try {
      if (act === 'accept')   await api(`/task/${id}/accept`, {method:'POST', body:'{}'});
      if (act === 'return')   await api(`/task/${id}/return`, {method:'POST', body: JSON.stringify({note: prompt('Что не так?') || ''})});
      bg.remove(); render();
    } catch (err) { alert(err.message); }
  };
  document.body.appendChild(bg);
}

function labelEvent(type){
  return ({
    created:'Задача поставлена', taken:'Взята в работу', submitted:'Отправлена на проверку',
    returned:'Возвращена на доработку', accepted:'Принята',
    chief_message:'Руководитель написал в карточке',
    initiative_answer:'Ответ по инициативе', manual:'Ручное действие',
  })[type] || type;
}

/**
 * Раздражители: то, что регулярно мешает работать. Задача из колонки «Заёб»
 * приносит приз тому, кто её закрыл, и не входит в KPI вообще.
 *
 * Приз платится пополам: половина сразу, вторая — через тридцать дней,
 * если проблема не всплыла снова. Обе половины подтверждаются здесь.
 */
function renderZaeby(d, v){
  const TIER = { S: '3 000', M: '5 000', L: '10 000', XL: '15 000' };
  const STATUS = {
    pending:   ['<span class="tag t-amber">ждёт подтверждения</span>', 'Подтвердить закрытие'],
    half_paid: ['<span class="tag t-blue">выплачена половина</span>', 'Не всплывало — доплатить'],
    confirmed: ['<span class="tag t-green">закрыт полностью</span>', null],
    rejected:  ['<span class="tag t-red">отклонён</span>', null],
  };

  const card = (z) => {
    const [badge, action] = STATUS[z.status] || ['', null];
    const due = z.confirmDue ? new Date(z.confirmDue) : null;
    const ready = !due || due <= new Date();
    return `
      <div class="card" style="margin-bottom:12px">
        <div class="row">
          <div style="flex:1;min-width:220px">
            <h3 style="margin-bottom:4px">${esc(z.title)}</h3>
            <p class="muted" style="margin:0">
              Закрыл: <b>${esc(z.userName || '—')}</b> ·
              тариф ${esc(z.tier || '—')} — ${TIER[z.tier] || '?'} ₽ ·
              ${badge}
            </p>
            ${z.status === 'half_paid' && due ? `<p class="muted" style="margin:6px 0 0">
              Вторая половина ${ready ? 'уже можно подтвердить' : 'откроется ' + due.toLocaleDateString('ru-RU')}</p>` : ''}
          </div>
          <div class="spacer"></div>
          <div class="row" style="gap:8px">
            ${action && ready ? `<button class="btn sm" data-zconfirm="${z.id}">${action}</button>` : ''}
            ${z.status !== 'confirmed' && z.status !== 'rejected'
              ? `<button class="btn ghost sm danger" data-zreject="${z.id}">Проблема вернулась</button>` : ''}
          </div>
        </div>
      </div>`;
  };

  const waiting = d.items.filter((z) => z.status === 'pending' || z.status === 'half_paid');
  const done = d.items.filter((z) => z.status === 'confirmed' || z.status === 'rejected');

  v.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div>
        <h1>Раздражители</h1>
        <p class="muted">Бытовые вопросы, которые регулярно мешают. В KPI не входят — только приз тому, кто закрыл</p>
      </div>
      <div class="spacer"></div>
      <div class="card" style="padding:14px 20px">
        <div class="kef"><span class="big">${money(d.paid)}</span><span class="muted">выплачено за период</span></div>
      </div>
    </div>

    <h2 style="margin-bottom:10px">Ждут вашего решения ${waiting.length ? `<span class="tag t-amber">${waiting.length}</span>` : ''}</h2>
    ${waiting.map(card).join('') || '<div class="card"><p class="muted" style="margin:0">Пока ничего не ждёт — закрытые раздражители появятся здесь сами</p></div>'}

    ${done.length ? `<h2 style="margin:26px 0 10px">История</h2>${done.map(card).join('')}` : ''}

    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:8px">Как это работает</h3>
      <p class="muted" style="margin:0">Задача из колонки «Заёб» в YouGile висит сразу на всех. Когда её переводят
      в «Завершена», система смотрит в журнал карточки, кто её передвинул, и предлагает выбрать размер.
      Половина приза платится сразу, вторая — через тридцать дней, если проблема не вернулась.
      Руководителю отдела идёт 10 % сверху, и только если закрыл не он сам.</p>
    </div>`;

  v.querySelectorAll('[data-zconfirm]').forEach((b) => {
    b.onclick = async () => {
      try { await api(`/zaeb/${b.dataset.zconfirm}/confirm`, { method: 'POST', body: '{}' }); render(); }
      catch (e) { alert(e.message); }
    };
  });
  v.querySelectorAll('[data-zreject]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Проблема вернулась? Приз не будет доплачен.')) return;
      try { await api(`/zaeb/${b.dataset.zreject}/reject`, { method: 'POST', body: '{}' }); render(); }
      catch (e) { alert(e.message); }
    };
  });
}

/**
 * Отдел: сверх оклада ассистентам платится только за заёбы и экономию,
