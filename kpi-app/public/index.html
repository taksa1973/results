<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KPI отдела ассистентов</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F7; --surface:#fff; --surface-2:#FAFAFC;
  --fg:#1D1D1F; --fg-2:#4B4B50; --fg-3:#86868B;
  --accent:#0071E3; --accent-soft:#E8F1FD;
  --green:#0B8A4B; --green-soft:#E6F5ED;
  --amber:#B26A00; --amber-soft:#FFF3E0;
  --red:#C4302B; --red-soft:#FDECEA;
  --border:#E3E3E7; --border-2:#EDEDF0;
  --radius:18px; --radius-sm:11px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --surface:#1C1C1E; --surface-2:#141416;
    --fg:#F5F5F7; --fg-2:#C7C7CC; --fg-3:#8E8E93;
    --accent:#2E9BFF; --accent-soft:#122437;
    --green:#4ADE80; --green-soft:#10241A;
    --amber:#FBBF24; --amber-soft:#2A2010;
    --red:#FF6B63; --red-soft:#2E1614;
    --border:#2C2C2E; --border-2:#242426;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{letter-spacing:-.02em;line-height:1.2;margin:0}
h1{font-size:26px;font-weight:750}h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:650}h4{font-size:15px;font-weight:650}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header.top{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--border-2);
}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:750;font-size:16px;margin-right:auto}
.who{font-size:13.5px;color:var(--fg-3)}
.who b{color:var(--fg)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 14px;border-radius:100px;font-size:14px;font-weight:550;color:var(--fg-2);
  background:transparent;border:none;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;
}
.tab:hover{background:var(--surface)}
.tab.on{background:var(--accent);color:#fff}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g4{grid-template-columns:1fr}}
section.page{padding:22px 0 60px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.metric .lbl{font-size:13px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.metric .val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.metric .sub{font-size:13px;color:var(--fg-3);margin-top:4px}
.bar{height:6px;border-radius:100px;background:var(--border);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:100px;transition:width .5s cubic-bezier(.16,1,.3,1)}

.kef{display:flex;align-items:baseline;gap:12px}
.kef .big{font-size:46px;font-weight:850;letter-spacing:-.04em;color:var(--accent);line-height:1}
.money{font-size:26px;font-weight:800;letter-spacing:-.03em}

table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:720px}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
th{
  text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--fg-3);padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);
  position:sticky;top:0;
}
td{padding:12px 14px;border-bottom:1px solid var(--border-2);color:var(--fg-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer;transition:background .15s}
tbody tr.clickable:hover{background:var(--surface-2)}
td strong{color:var(--fg)}
.num{text-align:right;white-space:nowrap}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:100px;white-space:nowrap}
.t-green{background:var(--green-soft);color:var(--green)}
.t-blue{background:var(--accent-soft);color:var(--accent)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-red{background:var(--red-soft);color:var(--red)}
.t-grey{background:var(--surface-2);color:var(--fg-3);border:1px solid var(--border)}

.btn{
  display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;font-family:inherit;
  font-size:14.5px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:100px;
  cursor:pointer;transition:opacity .2s,transform .12s;
}
.btn:hover{opacity:.88}.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--red)}
.btn.ghost.danger{background:transparent;color:var(--red);border-color:var(--red)}
/* отключённый сотрудник виден, но приглушён */
tr.off{opacity:.45}
/* Поля прямо в таблице. Ширины заданы через колонки, а не через поля,
   чтобы таблица влезала целиком и её не приходилось прокручивать. */
td .e{padding:6px 8px;font-size:14px;min-height:34px;border-radius:8px;width:100%;min-width:0}
#peopleTable{min-width:0;table-layout:fixed;width:100%}
#peopleTable th,#peopleTable td{padding:10px 8px}
#peopleTable col.c-name{width:17%}
#peopleTable col.c-role{width:14%}
#peopleTable col.c-grade{width:8%}
#peopleTable col.c-salary{width:9%}
#peopleTable col.c-yg{width:13%}
#peopleTable col.c-tg{width:11%}
#peopleTable col.c-nick{width:12%}
#peopleTable col.c-acts{width:16%}
/* технические id читать глазами не нужно — при наведении видно целиком */
td .e.id{font-size:12.5px;color:var(--fg-3)}
/* коэффициент помощи: минус, значение, плюс в одну строку */
td.help-cell{white-space:nowrap;display:flex;gap:5px;align-items:center;justify-content:flex-end}
td.help-cell .hb{min-height:28px;padding:0 9px;font-size:15px;line-height:1}
.help-val{font-size:15px;min-width:52px;text-align:center;cursor:pointer;border-radius:6px;padding:2px 4px}
.help-val[data-help-set]:hover{background:var(--surface-2);outline:1px solid var(--border)}
td.acts{white-space:nowrap;display:flex;gap:4px;justify-content:flex-end;align-items:center}
td.acts .btn{padding:0 9px;font-size:12.5px}
@media(max-width:1100px){
  #peopleTable{min-width:920px;table-layout:auto}
  td .e{width:auto}
}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px}

input,select{
  padding:10px 12px;font-size:15px;font-family:inherit;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);color:var(--fg);min-height:42px;width:100%;
}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label{display:block;font-size:13.5px;font-weight:550;margin-bottom:6px}
.field{margin-bottom:14px}

.muted{color:var(--fg-3);font-size:13.5px;line-height:1.5}
.why{
  margin-top:10px;padding:10px 12px;background:var(--surface-2);border-radius:10px;
  font-size:13px;color:var(--fg-2);line-height:1.6;border:1px solid var(--border-2);
}
/* Почему из кошелька пришло меньше, чем набрано по оценке */
.cuts{margin-top:10px;font-size:12.5px;color:var(--fg-3);line-height:1.5}
.cut{
  margin-top:6px;padding:7px 10px;border-radius:8px;
  background:var(--amber-soft);color:var(--amber);font-weight:600;
}
.cut .muted{color:inherit;opacity:.75;font-weight:400;font-size:12px}
.why b{color:var(--fg)}
details>summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:550;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:hover{text-decoration:underline}

.login{max-width:400px;margin:12vh auto;text-align:center}
.login .card{text-align:left}
.err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:12px}
.ok{background:var(--green-soft);color:var(--green);padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:12px}
.hide{display:none}

.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100;
}
.modal{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:680px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.timeline{list-style:none;padding:0;margin:14px 0 0}
.timeline li{padding:8px 0 8px 20px;border-left:2px solid var(--border);position:relative;font-size:14px}
.timeline li::before{content:'';position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timeline .t{color:var(--fg-3);font-size:12.5px}
.key-box{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:12px;word-break:break-all;margin-top:8px;
}

/* ── Модель времени ─────────────────────────────────────────────────────── */
/* таблица сотрудников: влезает целиком, строки раскрываются */
#kpiTable{min-width:0;table-layout:fixed}
#kpiTable th,#kpiTable td{padding:11px 10px}
#kpiTable td.num{font-variant-numeric:tabular-nums}
@media(max-width:900px){#kpiTable{min-width:760px;table-layout:auto}}
.mark{display:inline-block;min-width:44px;text-align:center;font-weight:800;letter-spacing:.02em;
  padding:3px 9px;border-radius:8px;font-size:14px}
.mark.m-minus{background:var(--red-soft);color:var(--red)}
.mark.m-plusminus{background:var(--amber-soft);color:var(--amber)}
.mark.m-plus{background:var(--accent-soft);color:var(--accent)}
.mark.m-plus2,.mark.m-plus3,.mark.m-plus4{background:var(--green-soft);color:var(--green)}
.mark.auto{opacity:.7;outline:1px dashed currentColor;outline-offset:-1px}
.pct-good{color:var(--green);font-weight:700}
.pct-mid{color:var(--amber);font-weight:700}
.pct-bad{color:var(--red);font-weight:700}
.access{display:inline-flex;gap:5px}
.access i{font-style:normal;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;
  background:var(--surface-2);color:var(--fg-3);border:1px solid var(--border)}
.access i.on{background:var(--green-soft);color:var(--green);border-color:transparent}

/* переключатели среза */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--fg-2);
  padding:6px 13px;border-radius:100px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* графики метрик */
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:960px){.charts{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.charts{grid-template-columns:1fr}}
.chart .lbl{font-size:12.5px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.chart .val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.chart .sub{font-size:12.5px;color:var(--fg-3);margin-top:2px}
.chart svg{width:100%;height:120px;margin-top:10px;display:block;overflow:visible}
.chart svg text{font-family:inherit;font-size:11px;fill:var(--fg-3)}
.chart svg .plan{stroke:var(--fg-3);stroke-dasharray:4 4;stroke-width:1.5}
.chart svg .b-ok{fill:var(--green)}
.chart svg .b-over{fill:var(--red)}
.chart svg .b-none{fill:var(--border)}
.chart svg .bv{fill:var(--fg);font-weight:700;font-size:11.5px}

/* раскрываемые месяцы и карточки людей */
details.month,details.person{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0;margin-bottom:10px;box-shadow:var(--shadow)}
details.month>summary,details.person>summary{
  display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:15px;font-weight:650;color:var(--fg);
  cursor:pointer;list-style:none;flex-wrap:wrap
}
details.month>summary::before,details.person>summary::before{
  content:'';width:8px;height:8px;border-right:2px solid var(--fg-3);border-bottom:2px solid var(--fg-3);
  transform:rotate(-45deg);transition:transform .2s;flex:none
}
details[open].month>summary::before,details[open].person>summary::before{transform:rotate(45deg)}
details.month>summary:hover,details.person>summary:hover{background:var(--surface-2);text-decoration:none}
details.month>.body,details.person>.body{padding:6px 16px 16px;border-top:1px solid var(--border-2)}
.sum-metrics{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:13px;color:var(--fg-3);font-weight:500}
.sum-metrics b{color:var(--fg)}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0 14px}
@media(max-width:900px){.six{grid-template-columns:repeat(3,1fr)}}
.six .m{background:var(--surface-2);border-radius:10px;padding:9px 10px;border:1px solid var(--border-2)}
.six .m .k{font-size:11px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.six .m .v{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.six .m .p{font-size:11.5px;margin-top:1px}
.lvl{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;font-size:12px;font-weight:800;
  background:var(--accent-soft);color:var(--accent)}
.lvl.l3{background:var(--red-soft);color:var(--red)}
.lvl.l2{background:var(--amber-soft);color:var(--amber)}
.lvl.l1{background:var(--green-soft);color:var(--green)}
.src{font-size:11px;color:var(--fg-3);margin-left:4px}
.review{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-2);margin-bottom:8px;font-size:14px}
.review .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--fg-3);margin-bottom:4px}
textarea{padding:10px 12px;font-size:15px;font-family:inherit;border:1px solid var(--border);border-radius:10px;
  background:var(--surface);color:var(--fg);width:100%;min-height:84px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.matrix{min-width:0;table-layout:fixed}
.matrix input{padding:6px 8px;min-height:34px;font-size:14px;text-align:right}
.sla-grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px 12px;align-items:center;max-width:620px}
.sla-grid .hd{font-size:12px;color:var(--fg-3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.sla-grid .rl{font-size:14px;font-weight:600}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="login" class="login">
  <h1 style="margin-bottom:8px">KPI отдела</h1>
  <p class="muted" style="margin-bottom:22px">Введите свой ключ доступа</p>
  <div class="card">
    <div class="field">
      <label for="keyInput">Ключ доступа</label>
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="например 7f3a…">
    </div>
    <button class="btn" id="loginBtn" style="width:100%;justify-content:center">Войти</button>
    <div id="loginErr" class="err hide"></div>
    <p class="muted" style="margin-top:14px">Ключ выдаёт руководитель отдела. Он хранится только в вашем браузере — на сервере лежит лишь его отпечаток.</p>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app" class="hide">
  <header class="top">
    <div class="top-in">
      <span class="brand">KPI отдела</span>
      <span class="who">Вход: <b id="whoName">—</b> · <span id="whoRole"></span></span>
      <select id="periodSel" style="width:auto;min-width:150px"></select>
      <select id="quarterSel" class="hide" style="width:auto;min-width:150px"></select>
      <button class="btn ghost sm" id="logoutBtn">Выйти</button>
    </div>
    <div class="wrap"><div class="tabs" id="tabs"></div></div>
  </header>

  <section class="page"><div class="wrap" id="view"></div></section>
</div>

<script>
const API = '/api';
let KEY = localStorage.getItem('kpi_key') || '';
let ME = null;
let PERIOD = '';
let QUARTER = '';
let TAB = 'kpi';

// ── вспомогательное ─────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const money = (n) => (n === null || n === undefined ? '—' : Math.round(n).toLocaleString('ru-RU') + ' ₽');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtDate(iso){
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('ru-RU', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}
function fmtSeconds(s){
  if (s === null || s === undefined) return '—';
  if (s < 60) return s + ' сек';
  const m = Math.round(s/60);
  if (m < 60) return m + ' мин';
  const h = Math.floor(m/60);
  return h + ' ч ' + (m%60) + ' мин';
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { 'x-access-key': KEY, 'content-type': 'application/json', ...(opts.headers||{}) },
  });
  if (res.status === 401) { logout(); throw new Error('ключ не подошёл'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'ошибка запроса');
  return data;
}

function logout(){
  localStorage.removeItem('kpi_key');
  KEY = ''; ME = null;
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
}

// ── вход ────────────────────────────────────────────────────────────────────
$('loginBtn').addEventListener('click', doLogin);
$('keyInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin(){
  const key = $('keyInput').value.trim();
  if (!key) return;
  try {
    const res = await fetch(API + '/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ key }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'ключ не подошёл');
    KEY = key;
    localStorage.setItem('kpi_key', key);
    ME = data.user;
    start();
  } catch (e) {
    $('loginErr').textContent = e.message;
    $('loginErr').classList.remove('hide');
  }
}

$('logoutBtn').addEventListener('click', logout);

// ── старт ───────────────────────────────────────────────────────────────────
async function boot(){
  if (!KEY) return;
  try {
    const res = await fetch(API + '/login', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ key: KEY }),
    });
    if (!res.ok) return logout();
    ME = (await res.json()).user;
    start();
  } catch { logout(); }
}

function start(){
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('whoName').textContent = ME.name;
  $('whoRole').textContent = ({assistant:'ассистент', lead:'руководитель отдела', chief:'руководитель'})[ME.role];

  // периоды: текущий и 11 предыдущих месяцев
  const sel = $('periodSel');
  sel.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const v = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const o = document.createElement('option');
    o.value = v;
    o.textContent = d.toLocaleString('ru-RU', {month:'long', year:'numeric'});
    sel.appendChild(o);
  }
  PERIOD = sel.value;
  sel.onchange = () => { PERIOD = sel.value; render(); };

  // кварталы: текущий и семь предыдущих — модель времени сводится поквартально
  const qs = $('quarterSel');
  qs.innerHTML = '';
  const curQ = Math.floor(now.getMonth() / 3) + 1;
  for (let i = 0; i < 8; i++){
    let q = curQ - i, y = now.getFullYear();
    while (q < 1) { q += 4; y -= 1; }
    const o = document.createElement('option');
    o.value = `${y}-Q${q}`;
    o.textContent = `${q}-й квартал ${y}`;
    qs.appendChild(o);
  }
  QUARTER = qs.value;
  qs.onchange = () => { QUARTER = qs.value; render(); };

  // Первая вкладка у всех — модель времени: по ней считается премия.
  // У владельца нет своих задач, поэтому нет и вкладки с личным результатом:
  // он смотрит отдел, принимает работу и подтверждает закрытые раздражители.
  const tabs = [{ id: 'kpi', name: 'KPI' }];
  if (ME.role === 'lead' || ME.role === 'chief') tabs.push({ id: 'team', name: 'Отдел' });
  if (ME.role === 'assistant' || ME.role === 'lead') tabs.push({ id: 'me', name: 'Мои результаты' });
  if (ME.role === 'lead' || ME.role === 'chief') {
    tabs.push({ id: 'inbox', name: 'Приёмка' });
    tabs.push({ id: 'zaeby', name: 'Раздражители' });
    tabs.push({ id: 'admin', name: 'Люди и настройки' });
  }
  TAB = tabs[0].id;

  $('tabs').innerHTML = '';
  tabs.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'tab' + (t.id === TAB ? ' on' : '');
    b.textContent = t.name;
    b.onclick = () => {
      TAB = t.id;
      [...$('tabs').children].forEach((c) => c.classList.toggle('on', c === b));
      render();
    };
    $('tabs').appendChild(b);
  });

  render();
}

// ── рендер ──────────────────────────────────────────────────────────────────
async function render(){
  const v = $('view');
  v.innerHTML = '<p class="muted">Загружаю…</p>';
  // модель времени живёт по кварталам, остальное — по месяцам
  $('quarterSel').classList.toggle('hide', TAB !== 'kpi');
  $('periodSel').classList.toggle('hide', TAB === 'kpi' || TAB === 'admin' || TAB === 'inbox');
  try {
    if (TAB === 'kpi')   return renderKpi(await api(`/kpi/board?quarter=${QUARTER}`), v);
    if (TAB === 'me')    return renderProfile(await api(`/me?period=${PERIOD}`), v);
    if (TAB === 'team')  return renderTeam(await api(`/team?period=${PERIOD}`), v);
    if (TAB === 'inbox') return renderInbox(await api('/inbox'), v);
    if (TAB === 'zaeby') return renderZaeby(await api(`/zaeby?period=${PERIOD}`), v);
    if (TAB === 'admin') return renderAdmin(v);
  } catch (e) {
    v.innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`;
  }
}

// ── Модель времени: Time to start / Time to fill ────────────────────────────
const TM = {
  t2s: { name: 'Время до старта', short: 'До старта', hint: 'от постановки до взятия в работу' },
  t2f: { name: 'Время до сдачи',  short: 'До сдачи',  hint: 'от постановки до завершения' },
};
const LEVEL_NAME = { 1: 'простые', 2: 'обычные', 3: 'сложные' };
const KEYS6 = ['t2s1', 't2s2', 't2s3', 't2f1', 't2f2', 't2f3'];
const MARK_TXT = { minus: '−', plusminus: '+−', plus: '+', plus2: '++', plus3: '+++', plus4: '++++' };
const MARK_HINT = {
  minus: 'план сорван', plusminus: 'ниже плана', plus: 'в плане',
  plus2: 'выше плана', plus3: 'сильно выше плана', plus4: 'сверхплан',
};
// что показывать в графиках: весь отдел или человек, все уровни или один
let KPI_VIEW = { who: 'team', level: 0 };
let KPI_DATA = null;

function fmtH(h){
  if (h === null || h === undefined) return '—';
  if (h < 1) return Math.round(h * 60) + ' мин';
  const s = (Math.round(h * 10) / 10).toLocaleString('ru-RU');
  return h >= 16 ? `${s} ч (${(Math.round(h / 8 * 10) / 10).toLocaleString('ru-RU')} дн)` : s + ' ч';
}
function pctClass(p){
  if (p === null || p === undefined) return 'muted';
  return p >= 100 ? 'pct-good' : p >= 80 ? 'pct-mid' : 'pct-bad';
}
function pctHtml(p){
  return p === null || p === undefined ? '<span class="muted">—</span>' : `<span class="${pctClass(p)}">${p} %</span>`;
}
function markHtml(mark, auto){
  if (!mark) return '<span class="muted">—</span>';
  return `<span class="mark m-${mark}${auto ? ' auto' : ''}" title="${auto ? 'предложение системы: ' : ''}${MARK_HINT[mark] || ''}">${MARK_TXT[mark] || mark}</span>`;
}
function monthName(period){
  const [y, m] = period.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
}
function monthShort(period){
  const [y, m] = period.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('ru-RU', { month: 'short' }).replace('.', '');
}

/** Столбики факта по месяцам, пунктир — план. Зелёный уложился, красный нет. */
function chartSvg(months, facts, plan){
  const W = 300, H = 120, padB = 22, padT = 16;
  const max = Math.max(plan || 0, ...facts.filter((v) => v !== null), 0.001) * 1.18;
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);
  const bw = 40, gap = (W - months.length * bw) / (months.length + 1);
  let out = '';
  months.forEach((p, i) => {
    const x = gap + i * (bw + gap);
    const f = facts[i];
    if (f === null || f === undefined) {
      out += `<rect x="${x}" y="${y(0) - 3}" width="${bw}" height="3" rx="1.5" class="b-none"/>`;
      out += `<text x="${x + bw / 2}" y="${y(0) - 8}" text-anchor="middle">нет задач</text>`;
    } else {
      const top = y(f), h = Math.max(2, y(0) - top);
      out += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="5" class="${plan && f > plan ? 'b-over' : 'b-ok'}"/>`;
      // над узким столбиком — только часы, дни не помещаются
      out += `<text x="${x + bw / 2}" y="${top - 5}" text-anchor="middle" class="bv">${f < 1 ? fmtH(f) : (Math.round(f * 10) / 10).toLocaleString('ru-RU') + ' ч'}</text>`;
    }
    out += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${monthShort(p)}</text>`;
  });
  if (plan) {
    out += `<line x1="0" x2="${W}" y1="${y(plan)}" y2="${y(plan)}" class="plan"/>`;
    out += `<text x="${W}" y="${y(plan) - 4}" text-anchor="end">план ${fmtH(plan)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${out}</svg>`;
}

/** Шесть плашек: значение, план и процент. */
function sixHtml(metrics, percents, sla, counts){
  return `<div class="six">${KEYS6.map((k) => {
    const m = k.slice(0, 3), l = +k.slice(3);
    const n = counts ? counts[k] : null;
    return `<div class="m" title="${TM[m].hint}">
      <div class="k">${TM[m].short} · ${l}</div>
      <div class="v">${fmtH(metrics[k])}</div>
      <div class="p">${pctHtml(percents[k])} <span class="muted">· план ${fmtH(sla[k])}${n !== null && n !== undefined ? ` · задач ${n}` : ''}</span></div>
    </div>`;
  }).join('')}</div>`;
}

/** Раскрываемый месяц: шесть метрик и список задач с часами. */
function monthHtml(m, sla, showWho, people){
  const who = (id) => (people.find((p) => p.id === id) || {}).name || '—';
  const counts = {};
  KEYS6.forEach((k) => { counts[k] = m.detail?.[k]?.count ?? 0; });
  const rows = m.tasks.map((t) => `
    <tr>
      <td><span class="lvl l${t.level}">${t.level}</span><span class="src" title="откуда уровень">${
        ({ sticker: 'стикер', model: 'модель', manual: 'руками', default: 'по размеру' })[t.level_src] || ''}</span></td>
      <td><strong>${esc(t.number || '')}</strong> ${esc(t.title)}</td>
      ${showWho ? `<td>${esc(who(t.assignee_id))}</td>` : ''}
      <td class="num">${fmtH(t.t2s)}</td>
      <td class="num">${t.t2f === null ? '<span class="muted">в работе</span>' : fmtH(t.t2f)}</td>
    </tr>`).join('');
  return `<details class="month">
    <summary>${monthName(m.period)}
      <span class="sum-metrics">
        <span>задач <b>${m.count}</b></span>
        <span>план <b>${m.avgPercent === null ? '—' : m.avgPercent + ' %'}</b></span>
      </span></summary>
    <div class="body">
      ${sixHtml(m.metrics, m.percents, sla, counts)}
      ${m.tasks.length ? `<div class="tbl"><table style="min-width:0">
        <thead><tr><th style="width:90px">Уровень</th><th>Задача</th>${showWho ? '<th>Кто</th>' : ''}
          <th class="num">До старта</th><th class="num">До сдачи</th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : '<p class="muted">В этом месяце задач не ставилось.</p>'}
    </div>
  </details>`;
}

/** Графики и месяцы для выбранного среза — перерисовываются без запроса. */
function renderKpiSlice(){
  const d = KPI_DATA;
  const src = KPI_VIEW.who === 'team' ? d.team : d.people.find((p) => p.id === KPI_VIEW.who);
  if (!src) return;
  const months = src.months;
  const keys = KPI_VIEW.level ? KEYS6.filter((k) => +k.slice(3) === KPI_VIEW.level) : KEYS6;
  const qm = src.quarter ? src.quarter.metrics : src.metrics;
  const qp = src.quarter ? src.quarter.percents : src.percents;

  $('kpiCharts').innerHTML = keys.map((k) => {
    const m = k.slice(0, 3), l = +k.slice(3);
    const facts = months.map((x) => x.metrics[k]);
    return `<div class="card chart">
      <div class="lbl">${TM[m].name} · уровень ${l}</div>
      <div class="val">${fmtH(qm[k])} <span class="sub" style="font-size:14px">${pctHtml(qp[k])}</span></div>
      <div class="sub">${LEVEL_NAME[l]} задачи, среднее за квартал · ${TM[m].hint}</div>
      ${chartSvg(months.map((x) => x.period), facts, d.sla[k])}
    </div>`;
  }).join('');

  $('kpiMonths').innerHTML = months.map((m) => monthHtml(m, d.sla, KPI_VIEW.who === 'team', d.people)).join('');
}

    </table></div>` : '';

  v.innerHTML = `
    <div class="row" style="margin-bottom:6px"><h1>KPI · ${esc($('quarterSel').selectedOptions[0]?.textContent || d.quarter)}</h1></div>
    <p class="muted" style="margin-bottom:16px">Две скорости — до старта и до сдачи — по трём уровням сложности, в рабочих часах.
      Каждый месяц сравнивается с планом, квартал — среднее трёх месяцев. Оценка и премия — по итогу квартала.</p>

    <div class="tbl" style="margin-bottom:22px"><table id="kpiTable">
      <thead><tr><th>Сотрудник</th><th class="num">Грейд</th><th>Доступы</th><th class="num">План</th>
        <th>Оценка</th><th class="num">Премия</th><th class="num">Сумма</th><th>Квартал</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="muted">Ассистентов нет</td></tr>'}</tbody>
    </table></div>

    <div class="row" style="margin-bottom:12px">
      <h2>Метрики по месяцам</h2><span class="spacer"></span>${whoSeg}${lvlSeg}
    </div>
    <div class="charts" id="kpiCharts" style="margin-bottom:22px"></div>

    <h2 style="margin-bottom:10px">Месяцы</h2>
    <div id="kpiMonths" style="margin-bottom:22px"></div>

    <h2 style="margin-bottom:10px">${boss ? 'Люди, отзывы и итог' : 'Мои отзывы и итог'}</h2>
    <div id="kpiPeople">${d.people.map(personCard).join('')}</div>
    ${peerBlock}
    ${slaBlock}`;

  renderKpiSlice();

  // ── обработчики
  v.querySelectorAll('#segWho button').forEach((b) => {
    b.onclick = () => {
      KPI_VIEW.who = b.dataset.who;
      v.querySelectorAll('#segWho button').forEach((x) => x.classList.toggle('on', x === b));
      renderKpiSlice();
    };
  });
  v.querySelectorAll('#segLvl button').forEach((b) => {
    b.onclick = () => {
      KPI_VIEW.level = +b.dataset.lvl;
      v.querySelectorAll('#segLvl button').forEach((x) => x.classList.toggle('on', x === b));
      renderKpiSlice();
    };
  });
  v.querySelectorAll('tr[data-open]').forEach((tr) => {
    tr.onclick = () => {
      const el = $('person_' + tr.dataset.open);
      if (!el) return;
      el.open = true;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  });

  v.querySelectorAll('[data-review]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.review;
      try {
        await api('/kpi/reviews', { method: 'POST', body: JSON.stringify({
          user_id: id, kind: b.dataset.kind, quarter: d.quarter,
          text: $('rev_text_' + id).value, mark: $('rev_mark_' + id).value || null,
        }) });
        render();
      } catch (e) { alert(e.message); }
    };
  });
  v.querySelectorAll('[data-delrev]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Удалить отзыв?')) return;
      await api('/kpi/reviews/' + b.dataset.delrev, { method: 'DELETE' });
      render();
    };
  });
  if ($('peerSend')) {
    $('peerSend').onclick = async () => {
      try {
        await api('/kpi/reviews', { method: 'POST', body: JSON.stringify({
          user_id: $('peer_who').value, kind: 'peer', quarter: d.quarter,
          text: $('peer_text').value, mark: $('peer_mark').value || null,
        }) });
        render();
      } catch (e) { alert(e.message); }
    };
  }
  v.querySelectorAll('[data-close]').forEach((b) => {
    b.onclick = async () => {
      const id = b.dataset.close;
      const mark = $('close_mark_' + id).value;
      if (!mark) return alert('Выберите итоговую оценку');
      const p = d.people.find((x) => x.id === id);
      if (!confirm(`Закрыть квартал для «${p.name}» с оценкой ${MARK_TXT[mark]}? Цифры заморозятся.`)) return;
      try {
        await api('/kpi/quarter/close', { method: 'POST', body: JSON.stringify({
          user_id: id, quarter: d.quarter, mark, note: $('close_note_' + id).value,
        }) });
        render();
      } catch (e) { alert(e.message); }
    };
  });
  v.querySelectorAll('[data-reopen]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Переоткрыть квартал? Итог будет удалён, цифры снова станут живыми.')) return;
      await api('/kpi/quarter/reopen', { method: 'POST', body: JSON.stringify({ user_id: b.dataset.reopen, quarter: d.quarter }) });
      render();
    };
  });

  if (!boss) return;

  $('saveSla').onclick = async () => {
    const values = {};
    KEYS6.forEach((k) => { values[k] = +$('sla_' + k).value; });
    try {
      await api('/kpi/sla', { method: 'POST', body: JSON.stringify({ quarter: $('slaFrom').value, values }) });
      await api('/admin/settings', { method: 'POST', body: JSON.stringify({ overplan_percent: String(+$('overplan').value || 120) }) });
      $('slaMsg').textContent = 'Сохранено';
      render();
    } catch (e) { $('slaMsg').textContent = e.message; }
  };

  // матрица подгружается отдельно — она нужна редко
  try {
    const { matrix } = await api('/kpi/matrix');
    $('matrixBody').innerHTML = [7, 6, 5, 4, 3, 2, 1].map((g) => `
      <tr data-grade="${g}"><td><strong>${g}</strong></td>
        ${d.marks.map((m) => `<td class="num"><input type="number" min="0" max="100" step="0.5" data-mark="${m.id}" value="${matrix[g]?.[m.id] ?? 0}"></td>`).join('')}
        <td class="num"><button class="btn ghost sm" data-savegrade="${g}">Сохранить</button></td></tr>`).join('');
    $('matrixBody').querySelectorAll('[data-savegrade]').forEach((b) => {
      b.onclick = async () => {
        const tr = b.closest('tr');
        const cells = {};
        tr.querySelectorAll('input[data-mark]').forEach((i) => { cells[i.dataset.mark] = +i.value; });
        try {
          await api('/kpi/matrix', { method: 'POST', body: JSON.stringify({ grade: +b.dataset.savegrade, cells }) });
          b.textContent = 'Сохранено';
          setTimeout(() => { b.textContent = 'Сохранить'; }, 1500);
        } catch (e) { alert(e.message); }
      };
    });
  } catch (e) {
    $('matrixBody').innerHTML = `<tr><td colspan="8" class="err">${esc(e.message)}</td></tr>`;
  }
}

const METRIC_META = {
  quality:     { name:'Качество',      purse:'quality' },
  speed:       { name:'Скорость',      purse:'speed' },
  autonomy:    { name:'Автономность',  purse:'autonomy' },
};

function renderProfile(p, v){
  const m = p.metrics, w = p.money.wallets, b = m.breakdown;

  const cards = Object.keys(METRIC_META).map((k) => {
    const meta = METRIC_META[k];
    const val = m[k];
    const wal = w[meta.purse];
    let why = '';
    if (k === 'quality') why = `<b>${b.quality.points}</b> баллов ÷ <b>${b.quality.weight}</b> размеров по <b>${b.quality.tasks}</b> задачам`;
    if (k === 'speed')   why = `реакция <b>${b.speed.chatScore}</b>: быстро ${b.speed.repliesFast}, медленно ${b.speed.repliesSlow}, вне часов ${b.speed.offHoursAnswered}, пропусков <b>${b.speed.misses}</b><br>медиана <b>${fmtSeconds(b.speed.medianReply)}</b><br>срок: <b>${b.speed.inTime}</b> из <b>${b.speed.withDeadline}</b> (${b.speed.slaRate})`;
    if (k === 'autonomy') why = `<b>${b.autonomy.solo}</b> из <b>${b.autonomy.of}</b> задач закрыто без вопросов в чат (${b.autonomy.rate}) при норме ${b.autonomy.norm}`;

    // Оценка 10 при неполном кошельке — это не ошибка, а сработавшая
    // поправка. Показываем её прямо в карточке, а не прячем в отчёт.
    const cuts = (wal.reductions || []).map((r) =>
      `<div class="cut">${r.factor < 1 ? '−' : '+'}${money(Math.abs(r.amount))} · ${esc(r.kind)} ×${r.factor}<br>
       <span class="muted">${esc(r.why)}</span></div>`
    ).join('');

    return `<div class="card metric">
      <div class="lbl">${meta.name}</div>
      <div class="val">${val.toFixed(2)}<span style="font-size:16px;color:var(--fg-3);font-weight:600"> / 10</span></div>
      <div class="sub">${money(wal.got)} из ${money(wal.pool)}</div>
      <div class="bar"><i style="width:${Math.min(100, val*10)}%"></i></div>
      ${cuts ? `<div class="cuts">по оценке набрано ${money(wal.earned)}${cuts}</div>` : ''}
      <details style="margin-top:10px"><summary>Откуда цифра</summary><div class="why">${why}<br><span class="muted">${esc(b[k].formula)}</span></div></details>
    </div>`;
  }).join('');

  v.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div><h1>${esc(p.user.name)}</h1><p class="muted">${
        p.user.role === 'assistant' ? `Грейд ${esc(p.user.grade)} · ` : ''
      }${p.tasks.length} закрытых задач, ${p.openTasks.length} в работе</p></div>
      <div class="spacer"></div>
      <div class="card" style="padding:14px 20px">
        <div class="kef"><span class="big">${p.money.kef.toFixed(2)}</span><span class="muted">кэф месяца</span></div>
      </div>
      <div class="card" style="padding:14px 20px">
        <div class="money">${money(p.money.total)}</div>
        <div class="muted">сверх оклада${p.money.cutApplied ? ' · применена отсечка ×0.85' : ''}</div>
      </div>
    </div>

    <div class="grid g4" style="margin-bottom:18px">${cards}</div>

    <div class="grid g4" style="margin-bottom:22px">
      <div class="card"><div class="lbl muted">KPI-бонус</div><div class="money">${money(p.money.bonus)}</div></div>
      <div class="card"><div class="lbl muted">Комиссия с экономии</div><div class="money">${money(p.money.savingPay)}</div><div class="muted">с ${money(p.money.savingSum)}</div></div>
      <div class="card"><div class="lbl muted">Призы за заёбы</div><div class="money">${money(p.money.zaeb)}</div></div>
      <div class="card"><div class="lbl muted">Оклад</div><div class="money">${money(p.money.salary)}</div></div>
    </div>

    ${p.help && p.help.multiplier !== 1 ? `
      <div class="card" style="margin-bottom:22px;border-color:${p.help.multiplier > 1 ? 'var(--green)' : 'var(--amber)'}">
        <div class="row">
          <div>
            <h3>${p.help.multiplier > 1 ? 'Надбавка от руководителя' : 'Понижающий коэффициент'}</h3>
            <p class="muted" style="margin:4px 0 0">
              Премия умножена на <b>×${p.help.multiplier.toFixed(2)}</b>${
                p.help.note ? ` — ${esc(p.help.note)}` : ''
              }
            </p>
          </div>
          <div class="spacer"></div>
          <div class="money" style="color:${p.help.multiplier > 1 ? 'var(--green)' : 'var(--amber)'}">
            ${p.help.delta > 0 ? '+' : ''}${money(p.help.delta)}
          </div>
        </div>
      </div>` : ''}

    ${chatReport(p)}

    <h2 style="margin-bottom:12px">Задачи за период</h2>
    ${taskTable(p.tasks.concat(p.openTasks))}
  `;
}

/** Отчёт по баллам: за что сняли, за что добавили, со ссылками на сообщения. */
function chatReport(p){
  const d = p.metrics.breakdown.speed.detail || [];
  if (!d.length) return '';

  const LABEL = {
    fast:    ['t-green', 'быстрый ответ'],
    slow:    ['t-grey',  'ответ вне нормы'],
    offhours:['t-blue',  'ответ в нерабочее время'],
    miss:    ['t-red',   'остался без ответа'],
  };

  const rows = d.map((x) => {
    const [cls, label] = LABEL[x.kind] || ['t-grey', x.kind];
    const link = x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">открыть</a>` : '';
    const sign = x.delta > 0 ? '+' : '';
    return `<tr>
      <td>${fmtDate(x.asked_at)}</td>
      <td><span class="tag ${cls}">${label}</span>${x.urgent ? ' <span class="tag t-amber">срочно</span>' : ''}</td>
      <td>${esc(x.why)}</td>
      <td class="num"><strong style="color:${x.delta < 0 ? 'var(--red)' : x.delta > 0 ? 'var(--green)' : 'var(--fg-3)'}">${sign}${x.delta}</strong></td>
      <td class="num">${link}</td>
    </tr>`;
  }).join('');

  const s = p.metrics.breakdown.speed;
  return `
    <h2 style="margin-bottom:6px">Отчёт по баллам за ответы</h2>
    <p class="muted" style="margin-bottom:12px">${esc(s.chatFormula)} — итог реакции <b>${s.chatScore}</b> из 10.
      Пропуск стоит трёх быстрых ответов, ответ в нерабочее время даёт вдвое больше обычного.</p>
    <div class="tbl" style="margin-bottom:26px"><table style="min-width:640px">
      <thead><tr><th>Когда</th><th>Что засчитано</th><th>Почему</th><th class="num">Баллы</th><th class="num">Сообщение</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function taskTable(tasks){
  if (!tasks.length) return '<div class="card"><p class="muted">За этот период задач нет.</p></div>';
  const rows = tasks.map((t) => {
    const st = {
      accepted:'<span class="tag t-green">принята</span>',
      review:'<span class="tag t-amber">на проверке</span>',
      in_progress:'<span class="tag t-blue">в работе</span>',
      open:'<span class="tag t-grey">не взята</span>',
      failed:'<span class="tag t-red">сорвана</span>',
      returned:'<span class="tag t-red">возвращена</span>',
    }[t.status] || t.status;

    const flags = t.flags ? [
      t.flags.inTime ? '' : '<span class="tag t-red">не в срок</span>',
      t.flags.noReturns ? '' : `<span class="tag t-amber">возвратов: ${t.returns}</span>`,
      t.flags.noChief ? '' : '<span class="tag t-amber">дёргал руководителя</span>',
    ].filter(Boolean).join(' ') : '';

    return `<tr class="clickable" data-task="${esc(t.id)}">
      <td><strong>${esc(t.title)}</strong><div style="margin-top:5px">${flags}</div></td>
      <td>${st}</td>
      <td class="num">${fmtDate(t.createdAt)}</td>
      <td class="num">${t.timing.toTakeHuman}</td>
      <td class="num">${t.timing.toDoHuman}</td>
      <td class="num">${t.timing.overdueHuman ? '<span style="color:var(--red)">+'+t.timing.overdueHuman+'</span>' : '<span style="color:var(--green)">в срок</span>'}</td>
      <td class="num">${t.size}${t.night ? '×1.5' : ''}</td>
      <td class="num"><strong style="font-size:16px">${t.score ?? '—'}</strong></td>
    </tr>`;
  }).join('');

  const html = `<div class="tbl"><table>
    <thead><tr>
      <th>Задача</th><th>Статус</th><th class="num">Поставлена</th>
      <th class="num">Взята через</th><th class="num">Делалась</th>
      <th class="num">Срок</th><th class="num">Размер</th><th class="num">Оценка</th>
    </tr></thead><tbody>${rows}</tbody>
  </table></div>`;

  setTimeout(() => {
    document.querySelectorAll('tr[data-task]').forEach((tr) => {
      tr.onclick = () => openTask(tr.dataset.task);
    });
  }, 0);
  return html;
}

async function openTask(id){
  let data;
  try { data = await api(`/events/${id}`); } catch (e) { return alert(e.message); }
  const t = data.task, ev = data.events, sc = data.score;

  const canAccept = ME.role === 'lead' || ME.role === 'chief';
  const actions = canAccept && t.status === 'review'
    ? `<div class="row" style="margin-top:16px">
         <button class="btn" data-act="accept">Принято</button>
         <button class="btn danger" data-act="return">Вернуть</button>
       </div>`
    : '';
  const disputeBtn = ME.role === 'lead' && t.chiefTouched && !t.disputed
    ? `<button class="btn ghost sm" data-act="dispute" style="margin-top:12px">Списать вовлечение: вопрос был по делу</button>`
    : '';

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <div class="row"><h2>${esc(t.title)}</h2><div class="spacer"></div>
      <button class="btn ghost sm" data-act="close">Закрыть</button></div>
    ${t.url ? `<p class="muted"><a href="${esc(t.url)}" target="_blank" rel="noopener">Открыть в YouGile →</a></p>` : ''}

    <div class="grid g2" style="margin-top:14px">
      <div class="why">
        <b>Тайминги</b><br>
        Поставлена: ${fmtDate(t.createdAt)}<br>
        Взята в работу: ${fmtDate(t.takenAt)} — через <b>${t.timing.toTakeHuman}</b><br>
        Отправлена на проверку: ${fmtDate(t.submittedAt)} — делалась <b>${t.timing.toDoHuman}</b><br>
        Принята: ${fmtDate(t.doneAt)}<br>
        Дедлайн: ${fmtDate(t.deadline)}${t.timing.overdueHuman ? ` — <span style="color:var(--red)">просрочка ${t.timing.overdueHuman}</span>` : ''}
      </div>
      <div class="why">
        <b>Оценка ${sc.score}</b> ${sc.reason ? `(${esc(sc.reason)})` : ''}<br>
        В срок: <b>${sc.flags.inTime ? 'да' : 'нет'}</b><br>
        Без правок: <b>${sc.flags.noReturns ? 'да' : 'нет'}</b> ${t.returns ? `(возвратов: ${t.returns})` : ''}<br>
        Без вовлечения руководителя: <b>${sc.flags.noChief ? 'да' : 'нет'}</b> ${t.disputed ? '<span class="tag t-blue">списано лидом</span>' : ''}<br>
      </div>
    </div>

    ${actions}${disputeBtn}

    <h3 style="margin-top:20px">Что происходило</h3>
    <ul class="timeline">
      ${ev.length ? ev.map((e) => `<li><b>${esc(labelEvent(e.type))}</b>${e.note ? ' — ' + esc(e.note) : ''}
        <div class="t">${fmtDate(e.at)}${e.actor ? ' · ' + esc(e.actor) : ''} · ${esc(e.source)}</div></li>`).join('')
      : '<li class="muted">Событий пока нет</li>'}
    </ul>
  </div>`;

  bg.onclick = async (e) => {
    const act = e.target.dataset?.act;
    if (!act) { if (e.target === bg) bg.remove(); return; }
    if (act === 'close') return bg.remove();
    try {
      if (act === 'accept')   await api(`/task/${id}/accept`, {method:'POST', body:'{}'});
      if (act === 'return')   await api(`/task/${id}/return`, {method:'POST', body: JSON.stringify({note: prompt('Что не так?') || ''})});
      if (act === 'dispute')  await api(`/task/${id}/dispute`, {method:'POST', body: JSON.stringify({note: prompt('Почему вопрос был по делу?') || ''})});
      bg.remove(); render();
    } catch (err) { alert(err.message); }
  };
  document.body.appendChild(bg);
}

function labelEvent(type){
  return ({
    created:'Задача поставлена', taken:'Взята в работу', submitted:'Отправлена на проверку',
    returned:'Возвращена на доработку', accepted:'Принята',
    chief_message:'Руководитель написал в карточке',
    initiative_answer:'Ответ по инициативе', manual:'Ручное действие',
  })[type] || type;
}

/**
 * Раздражители: то, что регулярно мешает работать. Задача из колонки «Заёб»
 * приносит приз тому, кто её закрыл, и не входит в KPI вообще.
 *
 * Приз платится пополам: половина сразу, вторая — через тридцать дней,
 * если проблема не всплыла снова. Обе половины подтверждаются здесь.
 */
function renderZaeby(d, v){
  const TIER = { S: '3 000', M: '5 000', L: '10 000', XL: '15 000' };
  const STATUS = {
    pending:   ['<span class="tag t-amber">ждёт подтверждения</span>', 'Подтвердить закрытие'],
    half_paid: ['<span class="tag t-blue">выплачена половина</span>', 'Не всплывало — доплатить'],
    confirmed: ['<span class="tag t-green">закрыт полностью</span>', null],
    rejected:  ['<span class="tag t-red">отклонён</span>', null],
  };

  const card = (z) => {
    const [badge, action] = STATUS[z.status] || ['', null];
    const due = z.confirmDue ? new Date(z.confirmDue) : null;
    const ready = !due || due <= new Date();
    return `
      <div class="card" style="margin-bottom:12px">
        <div class="row">
          <div style="flex:1;min-width:220px">
            <h3 style="margin-bottom:4px">${esc(z.title)}</h3>
            <p class="muted" style="margin:0">
              Закрыл: <b>${esc(z.userName || '—')}</b> ·
              тариф ${esc(z.tier || '—')} — ${TIER[z.tier] || '?'} ₽ ·
              ${badge}
            </p>
            ${z.status === 'half_paid' && due ? `<p class="muted" style="margin:6px 0 0">
              Вторая половина ${ready ? 'уже можно подтвердить' : 'откроется ' + due.toLocaleDateString('ru-RU')}</p>` : ''}
          </div>
          <div class="spacer"></div>
          <div class="row" style="gap:8px">
            ${action && ready ? `<button class="btn sm" data-zconfirm="${z.id}">${action}</button>` : ''}
            ${z.status !== 'confirmed' && z.status !== 'rejected'
              ? `<button class="btn ghost sm danger" data-zreject="${z.id}">Проблема вернулась</button>` : ''}
          </div>
        </div>
      </div>`;
  };

  const waiting = d.items.filter((z) => z.status === 'pending' || z.status === 'half_paid');
  const done = d.items.filter((z) => z.status === 'confirmed' || z.status === 'rejected');

  v.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div>
        <h1>Раздражители</h1>
        <p class="muted">Бытовые вопросы, которые регулярно мешают. В KPI не входят — только приз тому, кто закрыл</p>
      </div>
      <div class="spacer"></div>
      <div class="card" style="padding:14px 20px">
        <div class="kef"><span class="big">${money(d.paid)}</span><span class="muted">выплачено за период</span></div>
      </div>
    </div>

    <h2 style="margin-bottom:10px">Ждут вашего решения ${waiting.length ? `<span class="tag t-amber">${waiting.length}</span>` : ''}</h2>
    ${waiting.map(card).join('') || '<div class="card"><p class="muted" style="margin:0">Пока ничего не ждёт — закрытые раздражители появятся здесь сами</p></div>'}

    ${done.length ? `<h2 style="margin:26px 0 10px">История</h2>${done.map(card).join('')}` : ''}

    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:8px">Как это работает</h3>
      <p class="muted" style="margin:0">Задача из колонки «Заёб» в YouGile висит сразу на всех. Когда её переводят
      в «Завершена», система смотрит в журнал карточки, кто её передвинул, и предлагает выбрать размер.
      Половина приза платится сразу, вторая — через тридцать дней, если проблема не вернулась.
      Руководителю отдела идёт 10 % сверху, и только если закрыл не он сам.</p>
    </div>`;

  v.querySelectorAll('[data-zconfirm]').forEach((b) => {
    b.onclick = async () => {
      try { await api(`/zaeb/${b.dataset.zconfirm}/confirm`, { method: 'POST', body: '{}' }); render(); }
      catch (e) { alert(e.message); }
    };
  });
  v.querySelectorAll('[data-zreject]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Проблема вернулась? Приз не будет доплачен.')) return;
      try { await api(`/zaeb/${b.dataset.zreject}/reject`, { method: 'POST', body: '{}' }); render(); }
      catch (e) { alert(e.message); }
    };
  });
}

function renderTeam(d, v){
  const L = d.lead;
  const iAmLead = ME && ME.role === 'lead';

  const iAmChief = ME && ME.role === 'chief';

  // Коэффициент помощи. Кнопки двигают на шаг, по самому числу можно
  // кликнуть и вписать своё — в том числе меньше единицы.
  const canSetHelp = iAmChief || iAmLead;
  const helpCell = (p) => {
    if (!p.help) return '<td class="num">—</td>';
    const m = p.help.multiplier;
    const color = m > 1 ? 'var(--green)' : m < 1 ? 'var(--red)' : 'var(--fg-3)';
    return `<td class="num help-cell">
      ${canSetHelp ? `<button class="btn ghost sm hb" data-help-sub="${esc(p.id)}"
              ${m <= p.help.min ? 'disabled' : ''} title="минус ${p.help.step}">−</button>` : ''}
      <b class="help-val" style="color:${color}"
         ${canSetHelp ? `data-help-set="${esc(p.id)}" title="нажмите, чтобы вписать своё значение"` : ''}
      >×${m.toFixed(2)}</b>
      ${canSetHelp ? `<button class="btn sm hb" data-help-add="${esc(p.id)}"
              ${m >= p.help.max ? 'disabled' : ''} title="плюс ${p.help.step}">+</button>` : ''}
    </td>`;
  };

  const row = (p, extra) => `
    <tr data-person="${esc(p.id)}">
      <td class="clickable"><strong>${esc(p.name)}</strong> ${extra || ''}</td>
      <td class="num"><strong style="font-size:17px;color:var(--accent)">${p.kef.toFixed(2)}</strong></td>
      <td class="num">${p.metrics.quality.toFixed(1)}</td>
      <td class="num">${p.metrics.autonomy.toFixed(1)}</td>
      <td class="num">${p.metrics.speed.toFixed(1)}</td>
      <td class="num">${p.tasksClosed} / ${p.tasksOpen}</td>
      ${helpCell(p)}
      <td class="num"><strong>${money(p.total)}</strong></td>
    </tr>`;

  const rows = d.people.map((p) => row(p, `<span class="tag t-grey">${esc(p.grade)}</span>`)).join('');

  // Строка руководителя отдела в общей таблице: у него другой пул и другие
  // кошельки, но владельцу нужно видеть всех в одном месте.
  const leadRow = L.own ? `
    <tr class="clickable" data-person="${esc(L.id || '')}" style="border-top:2px solid var(--border)">
      <td><strong>${esc(L.name || 'Руководитель отдела')}</strong>
        <span class="tag t-blue">рук. отдела</span></td>
      <td class="num"><strong style="font-size:17px;color:var(--accent)">${(L.bonus / 5000).toFixed(2)}</strong></td>
      <td class="num">${L.own.quality.toFixed(1)}</td>
      <td class="num">${L.own.autonomy.toFixed(1)}</td>
      <td class="num">${L.own.speed.toFixed(1)}</td>
      <td class="num">${L.own.tasks} / ${L.own.openTasks}</td>
      ${helpCell({ id: L.id, help: L.own.help })}
      <td class="num"><strong>${money(L.bonus + L.shareZaeb + L.shareSaving)}</strong></td>
    </tr>` : '';

  v.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div><h1>Отдел</h1><p class="muted">Результаты за период</p></div>
      <div class="spacer"></div>
      <div class="card" style="padding:14px 20px"><div class="kef"><span class="big">${d.avgKef.toFixed(2)}</span><span class="muted">средний кэф ассистентов</span></div></div>
    </div>

    <div class="tbl" style="margin-bottom:26px"><table>
      <thead><tr>
        <th>Человек</th><th class="num">Кэф</th><th class="num">Кач.</th>
        <th class="num">Самост.</th><th class="num">Скор.</th><th class="num">Закрыто / в работе</th>
        <th class="num">Помощь</th><th class="num">К выплате</th>
      </tr></thead><tbody>${rows || '<tr><td colspan="8" class="muted">Ассистентов пока нет</td></tr>'}${leadRow}</tbody>
    </table></div>

    <h2 style="margin-bottom:4px">${iAmLead ? 'Ваш результат' : 'Результат руководителя отдела'}</h2>
    <p class="muted" style="margin-bottom:12px">Премия 50 000 ₽: своя работа плюс результат команды</p>
    <div class="grid g4">
      <div class="card metric"><div class="lbl">Результат отдела</div><div class="val">${money(L.wallets.team)}</div><div class="sub">средний кэф ассистентов ${L.avgKef.toFixed(2)}</div></div>
      <div class="card metric"><div class="lbl">Качество</div><div class="val">${money(L.wallets.quality)}</div><div class="sub">свои задачи: ${L.own ? L.own.quality.toFixed(1) : '—'} из 10</div></div>
      <div class="card metric"><div class="lbl">Самостоятельность</div><div class="val">${money(L.wallets.autonomy)}</div><div class="sub">свои задачи: ${L.own ? L.own.autonomy.toFixed(1) : '—'} из 10</div></div>
      <div class="card metric"><div class="lbl">Скорость</div><div class="val">${money(L.wallets.speed)}</div><div class="sub">${esc(L.speed.formula)}</div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="row">
        <div>
          <h3>Итого за период</h3>
          <p class="muted" style="margin:4px 0 0">включая долю с команды: заёбы ${money(L.shareZaeb)} + экономия ${money(L.shareSaving)}</p>
        </div>
        <div class="spacer"></div>
        <div class="money">${money(L.bonus + L.shareZaeb + L.shareSaving)}</div>
      </div>
    </div>
  `;

  // Коэффициент помощи: кнопки на шаг, клик по числу — ручной ввод.
  const setHelp = async (id, action, body = {}) => {
    try {
      await api(`/help/${id}/${action}?period=${PERIOD}`,
                { method: 'POST', body: JSON.stringify(body) });
      render();
    } catch (err) { alert(err.message); }
  };

  v.querySelectorAll('[data-help-add]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setHelp(b.dataset.helpAdd, 'add'); };
  });
  v.querySelectorAll('[data-help-sub]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setHelp(b.dataset.helpSub, 'sub'); };
  });
  v.querySelectorAll('[data-help-set]').forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      const cur = el.textContent.replace('×', '').trim();
      const raw = prompt(
        'Коэффициент премии. Больше 1 — надбавка, меньше 1 — снижение.\n' +
        'Например: 1.3 или 0.8',
        cur
      );
      if (raw === null) return;
      const value = Number(String(raw).replace(',', '.'));
      if (!Number.isFinite(value) || value <= 0) return alert('Нужно положительное число');
      const note = prompt('За что? Можно оставить пустым') ?? null;
      setHelp(el.dataset.helpSet, 'set', { value, note });
    };
  });

  v.querySelectorAll('tr[data-person] td.clickable').forEach((td) => {
    const tr = td.closest('tr');
    td.onclick = async () => {
      try {
        const p = await api(`/person/${tr.dataset.person}?period=${PERIOD}`);
        renderProfile(p, $('view'));
        window.scrollTo({top:0, behavior:'smooth'});
      } catch (e) { alert(e.message); }
    };
  });
}

function renderInbox(d, v){
  if (!d.tasks.length){
    v.innerHTML = '<div class="card"><h2>Приёмка пуста</h2><p class="muted">Ничего не ждёт решения.</p></div>';
    return;
  }
  v.innerHTML = `<h1 style="margin-bottom:6px">Приёмка</h1>
    <p class="muted" style="margin-bottom:16px">${d.tasks.length} задач ждут ответа. Кнопки «принято» и «вернуть» — единственное решение, которое требуется.</p>
    ${taskTable(d.tasks)}`;
}

async function renderAdmin(v){
  const [{users}, {settings}] = await Promise.all([api('/admin/users'), api('/admin/settings')]);

  // Все поля правятся прямо в строке: людей заводит и бот, и трекер,
  // поэтому дубли и пустые id — обычное дело, и чинить их надо здесь.
  const roleOpts = (cur) => [
    ['assistant', 'ассистент'], ['lead', 'рук. отдела'], ['chief', 'руководитель'],
  ].map(([v2, t]) => `<option value="${v2}"${v2 === cur ? ' selected' : ''}>${t}</option>`).join('');

  // Ширины подобраны так, чтобы таблица влезала целиком без прокрутки:
  // роль и грейд читаются полностью, а длинные технические id ужаты —
  // их всё равно не читают глазами, полное значение видно при наведении.
  const rows = users.map((u) => `
    <tr data-id="${esc(u.id)}"${u.active ? '' : ' class="off"'}>
      <td><input class="e" data-f="name" value="${esc(u.name)}" title="${esc(u.name)}"></td>
      <td><select class="e" data-f="role">${roleOpts(u.role)}</select></td>
      <td>${u.role === 'assistant'
        ? `<select class="e" data-f="grade_num">${[1,2,3,4,5,6,7].map((g) =>
            `<option value="${g}"${g === (u.grade_num || 3) ? ' selected' : ''}>${g}</option>`).join('')}</select>`
        : '<span class="muted">—</span>'}</td>
      <td><input class="e" data-f="salary" type="number" value="${u.salary | 0}"></td>
      <td><input class="e id" data-f="yougile_id" value="${esc(u.yougile_id || '')}"
                 placeholder="не задан" title="${esc(u.yougile_id || 'не задан')}"></td>
      <td><input class="e id" data-f="tg_user_id" value="${esc(u.tg_user_id || '')}"
                 placeholder="не задан" title="${esc(u.tg_user_id || 'не задан')}"></td>
      <td><input class="e" data-f="tg_username" value="${esc(u.tg_username || '')}"
                 placeholder="ник" title="${esc(u.tg_username || '')}"></td>
      <td class="num acts">
        <button class="btn sm" data-save="${esc(u.id)}">Сохранить</button>
        <button class="btn ghost sm" data-rotate="${esc(u.id)}" data-name="${esc(u.name)}">Ключ</button>
        <button class="btn ghost sm danger" data-del="${esc(u.id)}" data-name="${esc(u.name)}">×</button>
      </td>
    </tr>`).join('');

  const setFields = [
    ['yougile_key', 'Ключ API YouGile'],
    ['column_in_progress', 'ID колонки «В работе»'],
    ['column_review', 'ID колонки «На проверке»'],
    ['column_done', 'ID колонки «Готово»'],
    ['tg_chat_id', 'ID общего чата в Telegram'],
    ['reply_target_min', 'Норма ответа, минут'],
    ['work_start', 'Начало рабочего окна'],
    ['work_end', 'Конец рабочего окна'],
  ].map(([k, label]) => `<div class="field"><label for="s_${k}">${label}</label>
      <input id="s_${k}" value="${esc(settings[k] || '')}"></div>`).join('');

  v.innerHTML = `
    <h1 style="margin-bottom:6px">Люди</h1>
    <p class="muted" style="margin-bottom:14px">Любое поле правится прямо здесь. Telegram ID и ID в YouGile
      можно вписать вручную — бот подставит их сам только после первого сообщения в чате.</p>
    <div class="tbl" style="margin-bottom:16px"><table id="peopleTable">
      <colgroup>
        <col class="c-name"><col class="c-role"><col class="c-grade"><col class="c-salary">
        <col class="c-yg"><col class="c-tg"><col class="c-nick"><col class="c-acts">
      </colgroup>
      <thead><tr><th>Имя</th><th>Роль</th><th>Грейд</th><th>Оклад</th><th>YouGile ID</th><th>Telegram ID</th><th>Ник</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div id="keyBox" style="margin-bottom:22px"></div>

    <div class="card" style="margin-bottom:26px">
      <h3 style="margin-bottom:12px">Добавить человека</h3>
      <div class="grid g4">
        <div class="field"><label>Имя</label><input id="n_name"></div>
        <div class="field"><label>Роль</label><select id="n_role">
          <option value="assistant">ассистент</option><option value="lead">руководитель отдела</option>
          <option value="chief">руководитель</option></select></div>
        <div class="field" id="gradeField"><label>Грейд</label><select id="n_grade">
          ${[1,2,3,4,5,6,7].map((g) => `<option value="${g}"${g === 3 ? ' selected' : ''}>${g}</option>`).join('')}</select>
          <div class="muted" style="margin-top:5px">Только для ассистентов: от грейда зависит процент премии</div></div>
        <div class="field"><label>Оклад</label><input id="n_salary" type="number" value="0"></div>
        <div class="field"><label>ID в YouGile</label><input id="n_yg"></div>
        <div class="field"><label>ID в Telegram</label><input id="n_tg"></div>
      </div>
      <button class="btn" id="addUser">Создать и выдать ключ</button>
      <div id="newKeyBox"></div>
    </div>

    <h2 style="margin-bottom:12px">Настройки</h2>
    <div class="card">
      <div class="grid g2">${setFields}</div>
      <div class="row">
        <button class="btn" id="saveSettings">Сохранить</button>
        <button class="btn ghost" id="syncNow">Синхронизировать с YouGile</button>
        <span id="syncMsg" class="muted"></span>
      </div>
    </div>`;

  // грейд есть только у ассистентов — у руководителей его прячем
  const syncGradeField = () => {
    $('gradeField').style.display = $('n_role').value === 'assistant' ? '' : 'none';
  };
  $('n_role').onchange = syncGradeField;
  syncGradeField();

  $('addUser').onclick = async () => {
    try {
      const res = await api('/admin/users', {method:'POST', body: JSON.stringify({
        name: $('n_name').value.trim(), role: $('n_role').value, grade_num: +$('n_grade').value,
        salary: +$('n_salary').value || 0, yougile_id: $('n_yg').value.trim(),
        tg_user_id: $('n_tg').value.trim(),
      })});
      $('newKeyBox').innerHTML = `<div class="ok">Ключ создан. Показывается один раз — передайте его сотруднику:</div>
        <div class="key-box">${esc(res.key)}</div>`;
      $('n_name').value = '';
    } catch (e) { alert(e.message); }
  };

  // собирает поля строки в объект
  const rowData = (id) => {
    const tr = v.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
    const b = { id };
    tr.querySelectorAll('.e').forEach((el) => {
      b[el.dataset.f] = ['salary', 'grade_num'].includes(el.dataset.f) ? (+el.value || 0) : el.value.trim();
    });
    return b;
  };

  // ключ показываем в поле, откуда его можно выделить и скопировать
  const showKey = (name, key) => {
    $('keyBox').innerHTML = `
      <div class="card">
        <div class="ok" style="margin-bottom:8px">Новый ключ для «${esc(name)}». Старый больше не работает.</div>
        <div class="row" style="gap:8px">
          <input id="keyVal" readonly value="${esc(key)}" style="flex:1;font-family:ui-monospace,monospace">
          <button class="btn" id="copyKey">Скопировать</button>
        </div>
        <p class="muted" style="margin-top:8px">Ключ хранится только в виде отпечатка — увидеть его ещё раз нельзя.</p>
      </div>`;
    const inp = $('keyVal');
    inp.focus(); inp.select();
    $('copyKey').onclick = async () => {
      try {
        await navigator.clipboard.writeText(key);
        $('copyKey').textContent = 'Скопировано';
      } catch {
        // без разрешения на буфер обмена остаётся выделить руками
        inp.focus(); inp.select();
        $('copyKey').textContent = 'Выделено — Ctrl+C';
      }
    };
  };

  v.querySelectorAll('[data-save]').forEach((b) => {
    b.onclick = async () => {
      try {
        await api('/admin/users', { method: 'POST', body: JSON.stringify(rowData(b.dataset.save)) });
        b.textContent = 'Сохранено';
        setTimeout(() => { b.textContent = 'Сохранить'; }, 1500);
      } catch (e) { alert(e.message); }
    };
  });

  v.querySelectorAll('[data-rotate]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm(`Выдать новый ключ для «${b.dataset.name}»? Старый перестанет работать.`)) return;
      const res = await api('/admin/users', {
        method: 'POST',
        body: JSON.stringify({ ...rowData(b.dataset.rotate), rotateKey: true }),
      });
      showKey(b.dataset.name, res.key);
    };
  });

  v.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm(`Удалить «${b.dataset.name}»? Задачи и история останутся, но человек исчезнет из отдела.`)) return;
      await api('/admin/users/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
      renderAdmin(v);
    };
  });

  $('saveSettings').onclick = async () => {
    const patch = {};
    v.querySelectorAll('[id^="s_"]').forEach((i) => { patch[i.id.slice(2)] = i.value; });
    await api('/admin/settings', {method:'POST', body: JSON.stringify(patch)});
    $('syncMsg').textContent = 'Сохранено';
  };

  $('syncNow').onclick = async () => {
    $('syncMsg').textContent = 'Синхронизирую…';
    try {
      const r = await api('/admin/sync', {method:'POST', body:'{}'});
      $('syncMsg').textContent = r.ok ? `Готово, задач обработано: ${r.synced}` : r.error;
    } catch (e) { $('syncMsg').textContent = e.message; }
  };
}

boot();
</script>
</body>
</html>
