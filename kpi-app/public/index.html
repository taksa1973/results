      <td class="clickable"><strong>${esc(p.name)}</strong></td>
      <td class="num">${p.tasksClosed} / ${p.tasksOpen}</td>
      <td class="num">${p.medianReply === null || p.medianReply === undefined ? '—' : fmtSeconds(p.medianReply)}</td>
      <td class="num">${money(p.zaeb)}</td>
      <td class="num">${money(p.savingPay)}<div class="muted" style="font-size:12px">с ${money(p.savingSum)}</div></td>
      <td class="num"><strong>${money(p.total)}</strong></td>
    </tr>`).join('');

  const leadTotal = L.shareZaeb + L.shareSaving;
  const leadRow = L.id ? `
    <tr data-person="${esc(L.id)}" style="border-top:2px solid var(--border)">
      <td class="clickable"><strong>${esc(L.name)}</strong> <span class="tag t-blue">рук. отдела</span></td>
      <td class="num">${L.tasksClosed ?? '—'} / ${L.tasksOpen ?? '—'}</td>
      <td class="num">${L.medianReply === null || L.medianReply === undefined ? '—' : fmtSeconds(L.medianReply)}</td>
      <td class="num">${money(L.shareZaeb)}<div class="muted" style="font-size:12px">${Math.round(L.shares.zaeb * 100)} % с заёбов отдела</div></td>
      <td class="num">${money(L.shareSaving)}<div class="muted" style="font-size:12px">${Math.round(L.shares.saving * 100)} % с экономии</div></td>
      <td class="num"><strong>${money(leadTotal)}</strong></td>
    </tr>` : '';

  v.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      <div><h1>Отдел</h1><p class="muted">Заёбы и экономия за период. Премия руководителя отдела считается отдельно — по модели времени.</p></div>
    </div>

    <div class="grid g4" style="margin-bottom:22px">
      <div class="card"><div class="lbl muted">Заёбов закрыто на</div><div class="money">${money(d.teamZaeb)}</div></div>
      <div class="card"><div class="lbl muted">Сэкономлено</div><div class="money">${money(d.teamSaving)}</div></div>
      <div class="card"><div class="lbl muted">Ассистентам сверх оклада</div><div class="money">${money(d.people.reduce((a, p) => a + p.total, 0))}</div></div>
      <div class="card"><div class="lbl muted">Доля руководителя</div><div class="money">${money(leadTotal)}</div></div>
    </div>

    <div class="tbl"><table>
      <thead><tr>
        <th>Человек</th><th class="num">Закрыто / в работе</th><th class="num">Медиана ответа</th>
        <th class="num">Заёбы</th><th class="num">Экономия</th><th class="num">К выплате</th>
      </tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">Ассистентов пока нет</td></tr>'}${leadRow}</tbody>
    </table></div>
    <p class="muted" style="margin-top:8px">Медиана ответа в рабочем чате — справочно, на выплаты не влияет.</p>
  `;

  v.querySelectorAll('tr[data-person] td.clickable').forEach((td) => {
    const tr = td.closest('tr');
    td.onclick = async () => {
      try {
        const p = await api(`/person/${tr.dataset.person}?period=${PERIOD}`);
        await renderProfile(p, $('view'));
        window.scrollTo({top:0, behavior:'smooth'});
      } catch (e) { alert(e.message); }
    };
  });
}

function renderInbox(d, v){
  if (!d.tasks.length){
    v.innerHTML = '<div class="card"><h2>Приёмка пуста</h2><p class="muted">Ничего не ждёт решения.</p></div>';
    return;
  }
  const norm = d.norm ?? 8;
  const rows = d.tasks.map((t) => `
    <tr class="clickable" data-task="${esc(t.id)}">
      <td class="num ${t.waitingHours !== null && t.waitingHours > norm ? 'pct-bad' : ''}" style="white-space:nowrap">
        <strong>${fmtH(t.waitingHours)}</strong>
        <div class="muted" style="font-size:12px">${fmtDate(t.waitingSince)}</div></td>
      <td class="t-cell">${t.level ? `<span class="lvl l${t.level}" style="margin-right:6px">${t.level}</span>` : ''}<strong>${esc(t.number || '')}</strong>
        ${esc(String(t.title).replace(/\s+/g, ' ').slice(0, 160))}${String(t.title).length > 160 ? '…' : ''} ${ygLink(t)}</td>
      <td style="white-space:nowrap">${esc(t.assignee || '—')}</td>
      <td class="num acts" style="white-space:nowrap">
        <button class="btn sm" data-accept="${esc(t.id)}">Принято</button>
        <button class="btn ghost sm danger" data-return="${esc(t.id)}">Вернуть</button></td>
    </tr>`).join('');

  v.innerHTML = `<h1 style="margin-bottom:6px">Приёмка</h1>
    <p class="muted" style="margin-bottom:16px">${d.tasks.length} задач ждут решения. Пока задача здесь, её время не идёт в оценку ассистента —
      это очередь проверяющего. Норма ${fmtH(norm)}, дольше — в утреннем напоминании.</p>

    <div class="grid g4" style="margin-bottom:16px">
      <div class="card metric"><div class="lbl">Ждут решения</div><div class="val">${d.tasks.length}</div>
        <div class="sub">${d.overdue ? `<span class="pct-bad">дольше нормы: ${d.overdue}</span>` : 'все в норме'}</div></div>
      <div class="card metric"><div class="lbl">Дольше всех</div><div class="val small ${d.max > norm ? 'pct-bad' : ''}">${fmtH(d.max)}</div>
        <div class="sub">первая в списке</div></div>
      <div class="card metric"><div class="lbl">Медиана ожидания</div><div class="val small ${d.median > norm ? 'pct-bad' : ''}">${fmtH(d.median)}</div>
        <div class="sub">половина ждёт дольше</div></div>
      <div class="card metric"><div class="lbl">Норма</div><div class="val">${fmtH(norm)}</div>
        <div class="sub">меняется в настройках</div></div>
    </div>

    <div class="tbl"><table id="inboxTable">
      <thead><tr><th class="num" style="width:120px">Ждёт</th><th>Задача</th><th>Кто сдал</th><th class="num" style="width:190px"></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="muted" style="margin-top:8px">Клик по строке — история задачи и тайминги. «Принято» закрывает задачу, «Вернуть» отправляет на доработку и снимает баллы за качество.</p>`;

  v.querySelectorAll('tr[data-task]').forEach((tr) => {
    tr.onclick = (e) => { if (!e.target.closest('button, a')) openTask(tr.dataset.task); };
  });
  v.querySelectorAll('[data-accept]').forEach((b) => {
    b.onclick = async () => {
      b.disabled = true;
      try { await api(`/task/${b.dataset.accept}/accept`, { method: 'POST', body: '{}' }); render(); }
      catch (e) { b.disabled = false; alert(e.message); }
    };
  });
  v.querySelectorAll('[data-return]').forEach((b) => {
    b.onclick = async () => {
      const note = prompt('Что не так? Текст уйдёт в историю задачи');
      if (note === null) return;
      b.disabled = true;
      try { await api(`/task/${b.dataset.return}/return`, { method: 'POST', body: JSON.stringify({ note }) }); render(); }
      catch (e) { b.disabled = false; alert(e.message); }
    };
  });
}

async function renderAdmin(v){
  const [{users}, {settings}] = await Promise.all([api('/admin/users'), api('/admin/settings')]);

  // Все поля правятся прямо в строке: людей заводит и бот, и трекер,
  // поэтому дубли и пустые id — обычное дело, и чинить их надо здесь.
  const roleOpts = (cur) => [
    ['assistant', 'ассистент'], ['lead', 'рук. отдела'], ['chief', 'руководитель'],
  ].map(([v2, t]) => `<option value="${v2}"${v2 === cur ? ' selected' : ''}>${t}</option>`).join('');

  // Ширины подобраны так, чтобы таблица влезала целиком без прокрутки:
  // роль и грейд читаются полностью, а длинные технические id ужаты —
  // их всё равно не читают глазами, полное значение видно при наведении.
  const rows = users.map((u) => `
    <tr data-id="${esc(u.id)}"${u.active ? '' : ' class="off"'}>
      <td><input class="e" data-f="name" value="${esc(u.name)}" title="${esc(u.name)}"></td>
      <td><select class="e" data-f="role">${roleOpts(u.role)}</select></td>
      <td><span class="muted">—</span></td>
      <td><input class="e" data-f="salary" type="number" value="${u.salary | 0}"></td>
      <td><input class="e id" data-f="yougile_id" value="${esc(u.yougile_id || '')}"
                 placeholder="не задан" title="${esc(u.yougile_id || 'не задан')}"></td>
      <td><input class="e id" data-f="tg_user_id" value="${esc(u.tg_user_id || '')}"
                 placeholder="не задан" title="${esc(u.tg_user_id || 'не задан')}"></td>
      <td><input class="e" data-f="tg_username" value="${esc(u.tg_username || '')}"
                 placeholder="ник" title="${esc(u.tg_username || '')}"></td>
      <td class="num acts">
        <button class="btn sm" data-save="${esc(u.id)}">Сохранить</button>
        <button class="btn ghost sm" data-rotate="${esc(u.id)}" data-name="${esc(u.name)}">Ключ</button>
        <button class="btn ghost sm danger" data-del="${esc(u.id)}" data-name="${esc(u.name)}">×</button>
      </td>
    </tr>`).join('');

  const setFields = [
    ['yougile_key', 'Ключ API YouGile'],
    ['column_in_progress', 'ID колонки «В работе»'],
    ['column_review', 'ID колонки «На проверке»'],
    ['column_done', 'ID колонки «Готово»'],
    ['tg_chat_id', 'ID общего чата в Telegram'],
    ['reply_target_min', 'Норма ответа, минут'],
    ['work_start', 'Чат: начало окна ответов'],
    ['work_end', 'Чат: конец окна ответов'],
    ['task_day_start', 'Задачи: начало рабочего дня'],
    ['task_day_end', 'Задачи: конец рабочего дня'],
    ['tz_offset', 'Часовой пояс: смещение от UTC (Москва 3, Самара 4)'],
    ['skip_priority', 'Приоритеты вне расчёта (через запятую)'],
    ['metric_weights', 'Веса направлений (решение, выполнение, старт, качество)'],
    ['percent_cap', 'Потолок перевыполнения, %'],
    ['board_columns', 'Колонки доски отдела (через запятую)'],
    ['review_norm_hours', 'Проверка: норма, рабочих часов'],
    ['review_digest_hour', 'Проверка: час утреннего напоминания'],
  ].map(([k, label]) => `<div class="field"><label for="s_${k}">${label}</label>
      <input id="s_${k}" value="${esc(settings[k] || '')}"></div>`).join('');

  v.innerHTML = `
    <h1 style="margin-bottom:6px">Люди</h1>
    <p class="muted" style="margin-bottom:14px">Любое поле правится прямо здесь. Telegram ID и ID в YouGile
      можно вписать вручную — бот подставит их сам только после первого сообщения в чате.
      Премия руководителя отдела считается от максимума на вкладке KPI, оклад — справочно.</p>
    <div class="tbl" style="margin-bottom:16px"><table id="peopleTable">
      <colgroup>
        <col class="c-name"><col class="c-role"><col class="c-grade"><col class="c-salary">
        <col class="c-yg"><col class="c-tg"><col class="c-nick"><col class="c-acts">
      </colgroup>
      <thead><tr><th>Имя</th><th>Роль</th><th></th><th>Оклад</th><th>YouGile ID</th><th>Telegram ID</th><th>Ник</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div id="keyBox" style="margin-bottom:22px"></div>

    <div class="card" style="margin-bottom:26px">
      <h3 style="margin-bottom:12px">Добавить человека</h3>
      <div class="grid g4">
        <div class="field"><label>Имя</label><input id="n_name"></div>
        <div class="field"><label>Роль</label><select id="n_role">
          <option value="assistant">ассистент</option><option value="lead">руководитель отдела</option>
          <option value="chief">руководитель</option></select></div>
        <div class="field hide" id="gradeField"><label>Грейд</label><select id="n_grade">
          ${[1,2,3,4,5,6,7].map((g) => `<option value="${g}"${g === 3 ? ' selected' : ''}>${g}</option>`).join('')}</select></div>
        <div class="field"><label>Оклад</label><input id="n_salary" type="number" value="0"></div>
        <div class="field"><label>ID в YouGile</label><input id="n_yg"></div>
        <div class="field"><label>ID в Telegram</label><input id="n_tg"></div>
      </div>
      <button class="btn" id="addUser">Создать и выдать ключ</button>
      <div id="newKeyBox"></div>
    </div>

    <h2 style="margin-bottom:12px">Настройки</h2>
    <div class="card">
      <div class="grid g2">${setFields}</div>
      <div class="row">
        <button class="btn" id="saveSettings">Сохранить</button>
        <button class="btn ghost" id="syncNow">Синхронизировать с YouGile</button>
        <span id="syncMsg" class="muted"></span>
      </div>
    </div>`;

  // грейд в расчётах не участвует — поле спрятано, но данные в базе остаются
  const syncGradeField = () => {
    $('gradeField').style.display = 'none';
  };
  $('n_role').onchange = syncGradeField;
  syncGradeField();

  $('addUser').onclick = async () => {
    try {
      const res = await api('/admin/users', {method:'POST', body: JSON.stringify({
        name: $('n_name').value.trim(), role: $('n_role').value, grade_num: +$('n_grade').value,
        salary: +$('n_salary').value || 0, yougile_id: $('n_yg').value.trim(),
        tg_user_id: $('n_tg').value.trim(),
      })});
      $('newKeyBox').innerHTML = `<div class="ok">Ключ создан. Показывается один раз — передайте его сотруднику:</div>
        <div class="key-box">${esc(res.key)}</div>`;
      $('n_name').value = '';
    } catch (e) { alert(e.message); }
  };

  // собирает поля строки в объект
  const rowData = (id) => {
    const tr = v.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
    const b = { id };
    tr.querySelectorAll('.e').forEach((el) => {
      b[el.dataset.f] = ['salary', 'grade_num'].includes(el.dataset.f) ? (+el.value || 0) : el.value.trim();
    });
    return b;
  };

  // ключ показываем в поле, откуда его можно выделить и скопировать
  const showKey = (name, key) => {
    $('keyBox').innerHTML = `
      <div class="card">
        <div class="ok" style="margin-bottom:8px">Новый ключ для «${esc(name)}». Старый больше не работает.</div>
        <div class="row" style="gap:8px">
          <input id="keyVal" readonly value="${esc(key)}" style="flex:1;font-family:ui-monospace,monospace">
          <button class="btn" id="copyKey">Скопировать</button>
        </div>
        <p class="muted" style="margin-top:8px">Ключ хранится только в виде отпечатка — увидеть его ещё раз нельзя.</p>
      </div>`;
    const inp = $('keyVal');
    inp.focus(); inp.select();
    $('copyKey').onclick = async () => {
      try {
        await navigator.clipboard.writeText(key);
        $('copyKey').textContent = 'Скопировано';
      } catch {
        // без разрешения на буфер обмена остаётся выделить руками
        inp.focus(); inp.select();
        $('copyKey').textContent = 'Выделено — Ctrl+C';
      }
    };
  };

  v.querySelectorAll('[data-save]').forEach((b) => {
    b.onclick = async () => {
      try {
        await api('/admin/users', { method: 'POST', body: JSON.stringify(rowData(b.dataset.save)) });
        b.textContent = 'Сохранено';
        setTimeout(() => { b.textContent = 'Сохранить'; }, 1500);
      } catch (e) { alert(e.message); }
    };
  });

  v.querySelectorAll('[data-rotate]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm(`Выдать новый ключ для «${b.dataset.name}»? Старый перестанет работать.`)) return;
      const res = await api('/admin/users', {
        method: 'POST',
        body: JSON.stringify({ ...rowData(b.dataset.rotate), rotateKey: true }),
      });
      showKey(b.dataset.name, res.key);
    };
  });

  v.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm(`Удалить «${b.dataset.name}»? Задачи и история останутся, но человек исчезнет из отдела.`)) return;
      await api('/admin/users/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' });
      renderAdmin(v);
    };
  });

  $('saveSettings').onclick = async () => {
    const patch = {};
    v.querySelectorAll('[id^="s_"]').forEach((i) => { patch[i.id.slice(2)] = i.value; });
    await api('/admin/settings', {method:'POST', body: JSON.stringify(patch)});
    $('syncMsg').textContent = 'Сохранено';
  };

  $('syncNow').onclick = async () => {
    $('syncMsg').textContent = 'Синхронизирую…';
    try {
      const r = await api('/admin/sync', {method:'POST', body:'{}'});
      $('syncMsg').textContent = r.ok ? `Готово, задач обработано: ${r.synced}` : r.error;
    } catch (e) { $('syncMsg').textContent = e.message; }
  };
}

boot();
</script>
</body>
</html>
